    <script>
        // Diagnostic : affiche un message si le site ne démarre pas
        (function () {
            var pending = null;
            function apply() {
                var b = document.getElementById('boot');
                if (b && pending) b.innerHTML = pending;
            }
            function show(html) { pending = html; apply(); }
            document.addEventListener('DOMContentLoaded', apply);
            window.addEventListener('error', function (e) {
                var t = e.target;
                if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
                    show('<p style="font-weight:700">Impossible de charger un composant du site.</p><p style="opacity:.7;font-size:12px;word-break:break-all">' + (t.src || t.href) + '</p><p style="opacity:.7;font-size:12px">Vérifiez votre connexion internet puis rechargez.</p><button onclick="location.reload()" style="margin-top:12px;padding:8px 16px;border-radius:12px;border:1px solid currentColor;background:none;color:inherit;font-weight:700">Recharger</button>');
                } else {
                    show('<p style="font-weight:700">Une erreur empêche le site de s\'afficher.</p><pre style="white-space:pre-wrap;opacity:.7;font-size:12px;text-align:left">' + String(e.message || e.error || 'Erreur inconnue').replace(/</g, '&lt;') + '</pre><button onclick="location.reload()" style="margin-top:12px;padding:8px 16px;border-radius:12px;border:1px solid currentColor;background:none;color:inherit;font-weight:700">Recharger</button>');
                }
            }, true);
            setTimeout(function () {
                var h = document.getElementById('boot-hint');
                if (h) h.textContent = 'Le chargement est long : connexion lente ? Patientez ou rechargez la page.';
            }, 10000);
        })();

const DIY_VOLUMES = ['10ml', '30ml', '50ml', '100ml', '200ml', '500ml'];

        // Tri stable des rubriques selon l'ordre d'affichage choisi par l'administrateur
        const sortCategories = (list) => list.slice().sort((a, b) => (a.display_order ?? 0) - (b.display_order ?? 0));

        const fetchAll = async (table) => {
            const pageSize = 1000;
            let from = 0;
            let all = [];
            while (true) {
                let data, error;
                if (table === 'categories') {
                    const res = await supabaseClient.from(table).select('*').order('display_order', { ascending: true }).order('id').range(from, from + pageSize - 1);
                    if (res.error) {
                        const fallbackRes = await supabaseClient.from(table).select('*').order('id').range(from, from + pageSize - 1);
                        if (fallbackRes.error) throw fallbackRes.error;
                        data = fallbackRes.data;
                    } else {

                    }
                } else {
                    const res = await supabaseClient.from(table).select('*').order('id').range(from, from + pageSize - 1);
                    if (res.error) throw res.error;
                    data = res.data;
                }
                all = all.concat(data || []);
                if (!data || data.length < pageSize) break;
                from += pageSize;
            }
            return all;
        };

        const compressImage = (file, maxSize = 1200, quality = 0.82) => new Promise((resolve) => {
            if (!file.type.startsWith('image/') || file.type === 'image/gif' || file.type === 'image/svg+xml') return resolve(file);
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(url);
                const ratio = Math.min(1, maxSize / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * ratio);
                canvas.height = Math.round(img.height * ratio);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                canvas.toBlob((blob) => {
                    if (!blob || blob.size >= file.size) return resolve(file);
                    resolve(blob);
                }, 'image/webp', quality);
            };
            img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
            img.src = url;
        });

        const uploadImageToSupabase = async (file) => {
            if (!file) return null;
            const body = await compressImage(file);
            const isOriginal = body === file;
            const ext = isOriginal ? (file.name.split('.').pop() || 'jpg') : (body.type === 'image/webp' ? 'webp' : 'png');
            const filePath = `${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${ext}`;

            const { error } = await supabaseClient.storage
                .from('esigara-media')
                .upload(filePath, body, { contentType: body.type || undefined, cacheControl: '31536000' });

            if (error) {
                alert("Erreur d'upload image : " + error.message);
                return null;
            }

            const { data: publicUrlData } = supabaseClient.storage.from('esigara-media').getPublicUrl(filePath);
            return publicUrlData.publicUrl;
        };

                                <span className="text-xs font-bold text-slate-400 uppercase">Quantité :</span>
                                <div className="flex items-center space-x-2">
                                    <button onClick={() => onQty(product.id, Math.max(1, qty - 1))} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-xl text-sm font-bold">-</button>
                                    <span className="text-sm font-bold text-teal-400 px-2">{qty}</span>
                                    <button onClick={() => onQty(product.id, qty + 1)} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-xl text-sm font-bold">+</button>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={onCopyLink} className="px-3 py-3 bg-slate-950 border border-slate-800 hover:bg-slate-800 text-slate-300 rounded-2xl text-[11px] font-bold transition" title="Copier le lien de ce produit">
                                    🔗 Lien
                                </button>
                                <button
                                    onClick={() => { onAdd(product, currentVariant, qty); onClose(); }}
                                    disabled={unavailable}
                                    className="px-6 py-3 bg-teal-500 hover:bg-teal-400 disabled:opacity-40 text-black rounded-2xl text-xs font-black uppercase tracking-wider transition shadow-lg shadow-teal-500/25">
                                    {unavailable ? 'Épuisé' : 'Ajouter au panier'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function CategoryTreeItem({ category, categories, depth = 0, onAddChild, onEdit, onDelete, onMove }) {
            const subCats = categories.filter(sub => sub.parent_id === category.id);
            return (
                <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2">
                    <div className="flex items-center justify-between flex-wrap gap-2">
                        <div className="flex items-center space-x-2">
                            <div className="flex flex-col space-y-0.5">
                                <button onClick={() => onMove(category, -1)} className="text-[9px] bg-slate-900 hover:bg-slate-800 text-slate-300 px-1 rounded border border-slate-800" title="Monter">▲</button>
                                <button onClick={() => onMove(category, 1)} className="text-[9px] bg-slate-900 hover:bg-slate-800 text-slate-300 px-1 rounded border border-slate-800" title="Descendre">▼</button>
                            </div>
                            <div className="w-8 h-8 rounded-lg border border-slate-800 bg-white flex items-center justify-center p-0.5">
                                <img src={category.image} alt={category.name} className="max-w-full max-h-full object-contain" />
                            </div>
                            <span className={`font-extrabold text-xs ${depth === 0 ? 'text-teal-400' : 'text-slate-200'}`}>
                                {depth > 0 && <span className="text-slate-500 mr-1">↳</span>}
                                {category.name} <span className="text-[10px] text-slate-500 font-normal">(Ordre: {category.display_order ?? 0})</span>
                            </span>
                        </div>
                        <div className="flex items-center space-x-1">
                            <button onClick={() => onAddChild(category)} className="px-2 py-1 bg-teal-500/10 text-teal-400 rounded-lg text-[10px] font-bold border border-teal-500/20">
                                + Enfant
                            </button>
                            <button onClick={() => onEdit(category)} className="px-2 py-1 bg-amber-500/10 text-amber-400 rounded-lg text-[10px] font-bold">
                                Editer
                            </button>
                            <button onClick={() => onDelete(category.id)} className="px-2 py-1 bg-rose-500/10 text-rose-400 rounded-lg text-[10px] font-bold">
                                Supprimer
                            </button>
                        </div>
                    </div>

                    {subCats.length > 0 && (
                        <div className="pl-4 border-l-2 border-slate-800 space-y-2 pt-1">
                            {subCats.map(sub => (
                                <CategoryTreeItem key={sub.id} category={sub} categories={categories} depth={depth + 1} onAddChild={onAddChild} onEdit={onEdit} onDelete={onDelete} onMove={onMove} />
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ====================================================================
        // Application
        // ====================================================================
        function App() {
            const [isAgeVerified, setIsAgeVerified] = useState(false);

            useEffect(() => {
                try {
                    if (localStorage.getItem('esigara_age_verified') === 'true') setIsAgeVerified(true);
                } catch (e) {}
            }, []);

            // Thème clair / sombre (mémorisé dans le navigateur)
            const [theme, setTheme] = useState(() => {
                try { return localStorage.getItem('esigara_theme') === 'light' ? 'light' : 'dark'; } catch (e) { return 'dark'; }
            });
            useEffect(() => {
                document.documentElement.className = theme;
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#020617' : '#f1f5f9');
            }, [theme]);
            const toggleTheme = () => {
                const next = theme === 'dark' ? 'light' : 'dark';
                setTheme(next);
                try { localStorage.setItem('esigara_theme', next); } catch (e) {}
            };

            const confirmAge = () => {
                try { localStorage.setItem('esigara_age_verified', 'true'); } catch (e) {}
                setIsAgeVerified(true);
            };

            const [currentView, setCurrentView] = useState('home');
            const [selectedCategoryId, setSelectedCategoryId] = useState(null);
            const [selectedBrandId, setSelectedBrandId] = useState(null);

            const [searchQuery, setSearchQuery] = useState('');
            const [showCartModal, setShowCartModal] = useState(false);
            const [selectedProductId, setSelectedProductId] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState('');

            const [brands, setBrands] = useState([]);
            const [categories, setCategories] = useState([]);
            const [products, setProducts] = useState([]);
            const [settings, setSettings] = useState(DEFAULT_SETTINGS);

            // Modèle de prix DIY préconfiguré par volume et par taux de nicotine
            const [diyPresetPrices, setDiyPresetPrices] = useState(() => {
                try {
                    const saved = localStorage.getItem('esigara_diy_preset_v2');
                    if (saved) return JSON.parse(saved);
                } catch (e) {}
                
                const def = {};
                ['10ml', '30ml', '50ml', '100ml', '200ml', '500ml'].forEach(vol => {
                    ['0mg', '3mg', '6mg'].forEach(nic => {
                        def[`${vol}_${nic}`] = '';
                    });
                });
                return def;
            });

            const hideOutOfStock = settings.hideOutOfStock;
            const isVisible = (p) => !hideOutOfStock || p.variants.some(isInStock);

            const loadDataFromSupabase = async () => {
                setIsLoading(true);
                setLoadError('');
                try {
                    const [bData, cData, pData, vData, sRes] = await Promise.all([
                        fetchAll('brands'),
                        fetchAll('categories'),
                        fetchAll('products'),
                        fetchAll('variants'),
                        supabaseClient.from('settings').select('*').eq('id', 1).maybeSingle()
                    ]);

                    setBrands(bData);
                    setCategories(sortCategories(cData));
                    setProducts(pData.map(p => ({
                        ...p,
                        variants: vData.filter(v => v.product_id === p.id)
                    })));

                    if (sRes.error) {
                        console.warn("Table 'settings' introuvable ou inaccessible :", sRes.error.message);
                    } else if (sRes.data) {
                        setSettings({
                            whatsappNumber: sRes.data.whatsapp_number || DEFAULT_SETTINGS.whatsappNumber,
                            whatsappMessage: sRes.data.whatsapp_message || DEFAULT_SETTINGS.whatsappMessage,
                            messengerUrl: sRes.data.messenger_url || DEFAULT_SETTINGS.messengerUrl,
                            hideOutOfStock: !!sRes.data.hide_out_of_stock
                        });
                    }
                } catch (err) {
                    console.error("Erreur de chargement :", err);
                    setLoadError(err.message || 'Impossible de charger le catalogue.');
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                loadDataFromSupabase();
            }, []);

            const [adminUnlocked, setAdminUnlocked] = useState(false);
            useEffect(() => {
                supabaseClient.auth.getSession().then(({ data }) => setAdminUnlocked(!!data?.session));
                const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, session) => setAdminUnlocked(!!session));
                return () => sub?.subscription?.unsubscribe();
            }, []);

            useEffect(() => {
                const handlePopState = (event) => {
                    setSelectedProductId(null);
                    if (event.state) {
                        setCurrentView(event.state.view || 'home');
                        setSelectedCategoryId(event.state.categoryId || null);
                        setSelectedBrandId(event.state.brandId || null);
                        setSearchQuery(event.state.searchQuery || '');
                    } else {
                        setCurrentView('home');
                        setSelectedCategoryId(null);
                        setSelectedBrandId(null);
                        setSearchQuery('');
                    }
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            const navigateTo = (view, catId = null, brandId = null, query = '') => {
                window.history.pushState({ view, categoryId: catId, brandId, searchQuery: query }, '', `#${view}`);
                setSelectedProductId(null);
                setCurrentView(view);
                setSelectedCategoryId(catId);
                setSelectedBrandId(brandId);
                if (query !== '') setSearchQuery(query);
                window.scrollTo(0, 0);
            };

            const openProduct = (id) => {
                setSelectedProductId(id);
                try { window.history.replaceState(window.history.state, '', `#produit/${encodeURIComponent(id)}`); } catch (e) {}
            };
            const closeProduct = () => {
                setSelectedProductId(null);
                try { window.history.replaceState(window.history.state, '', `#${currentView}`); } catch (e) {}
            };
            const copyProductLink = async () => {
                const url = window.location.href;
                try {
                    await navigator.clipboard.writeText(url);
                    alert('Lien du produit copié !');
                } catch (e) {
                    prompt('Copiez le lien de ce produit :', url);
                }
            };

            const deepLinkDone = useRef(false);
            useEffect(() => {
                if (deepLinkDone.current || isLoading || products.length === 0) return;
                deepLinkDone.current = true;
                const m = window.location.hash.match(/^#produit\/(.+)$/);
                if (m) {
                    const id = decodeURIComponent(m[1]);
                    if (products.some(p => String(p.id) === id)) setSelectedProductId(products.find(p => String(p.id) === id).id);
                }
            }, [isLoading, products]);

            const handleSearchSubmit = (e) => {
                e.preventDefault();
                if (searchQuery.trim()) {
                    navigateTo('search', null, null, searchQuery);
                }
            };

            const [cart, setCart] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('esigara_cart') || '[]');
                    return Array.isArray(saved) ? saved : [];
                } catch (e) { return []; }
            });
            useEffect(() => {
                try { localStorage.setItem('esigara_cart', JSON.stringify(cart)); } catch (e) {}
            }, [cart]);

            const [cartNotice, setCartNotice] = useState(null);
            const [selectedVariantByProduct, setSelectedVariantByProduct] = useState({});
            const [quantityByProduct, setQuantityByProduct] = useState({});

            const onSelectVariant = (productId, variantId) => setSelectedVariantByProduct(prev => ({ ...prev, [productId]: variantId }));
            const onQty = (productId, qty) => setQuantityByProduct(prev => ({ ...prev, [productId]: qty }));

            const cartLines = cart.map(item => {
                const product = products.find(p => p.id === item.productId);
                const variant = product?.variants.find(v => v.id === item.variantId);
                return product && variant ? { ...item, product, variant } : null;
            }).filter(Boolean);
            const cartCount = cartLines.reduce((sum, l) => sum + l.quantity, 0);
            const cartTotal = cartLines.reduce((sum, l) => sum + (Number(l.variant.price) || 0) * l.quantity, 0);

            const addToCart = (product, variant, qty = 1) => {
                if (!variant || !variant.id) return alert('Aucune déclinaison disponible pour ce produit.');
                if (!isInStock(variant)) return alert('Déclinaison en rupture de stock.');

                setCart(prev => {
                    const idx = prev.findIndex(i => i.variantId === variant.id);
                    if (idx > -1) {
                        return prev.map((i, n) => n === idx ? { ...i, quantity: i.quantity + qty } : i);
                    }
                    return [...prev, { productId: product.id, variantId: variant.id, quantity: qty }];
                });
                setCartNotice(null);
                setShowCartModal(true);
            };

            const changeCartQty = (variantId, delta) => {
                setCart(prev => prev.map(i => i.variantId === variantId ? { ...i, quantity: Math.max(1, i.quantity + delta) } : i));
            };
            const removeFromCart = (variantId) => setCart(prev => prev.filter(i => i.variantId !== variantId));
            const clearCart = () => { setCart([]); setCartNotice(null); };

            const buildOrderText = () => {
                let text = `${settings.whatsappMessage}\n`;
                cartLines.forEach((l) => {
                    const details = [];
                    const flavor = getFlavor(l.product, l.variant);
                    if (flavor) details.push(`Saveur: ${flavor}`);
                    if (isSet(l.variant.volume_ml)) details.push(l.variant.volume_ml);
                    if (isSet(l.variant.nicotine_level)) details.push(`Nic: ${l.variant.nicotine_level}`);
                    if (isSet(l.variant.ohm_value)) details.push(l.variant.ohm_value);
                    if (isSet(l.variant.color_finish)) details.push(l.variant.color_finish);
                    text += `- ${l.product.name} (${l.quantity}x)${details.length ? ` [${details.join(' | ')}]` : ''} - ${fmt(l.variant.price * l.quantity)} Ar\n`;
                });
                text += `\nTotal : *${fmt(cartTotal)} Ar*`;
                return text;
            };

            const checkoutWhatsApp = () => {
                const number = (settings.whatsappNumber || '').replace(/[^0-9]/g, '');
                if (!number) return alert("Le numéro WhatsApp n'est pas configuré.");
                window.open(`https://wa.me/${number}?text=${encodeURIComponent(buildOrderText())}`, '_blank');
                setCartNotice({ message: "WhatsApp s'ouvre avec votre commande. Votre panier est conservé jusqu'à ce que vous le vidiez." });
            };

            const checkoutMessenger = () => {
                if (!settings.messengerUrl) return alert("Le lien Messenger n'est pas configuré.");
                const text = buildOrderText();
                let copied = false;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).catch(() => {});
                    copied = true;
                }
                window.open(settings.messengerUrl, '_blank');
                setCartNotice(copied
                    ? { message: 'Commande copiée ! Collez-la (appui long > Coller) dans la conversation Messenger.' }
                    : { message: 'Copiez votre commande ci-dessous, puis collez-la dans Messenger :', text });
            };

            const [showAuthModal, setShowAuthModal] = useState(false);
            const [adminEmail, setAdminEmail] = useState('');
            const [adminPassword, setAdminPassword] = useState('');
            const [authError, setAuthError] = useState('');
            const [adminTab, setAdminTab] = useState('products');

            const handleSupabaseLogin = async (e) => {
                e.preventDefault();
                setAuthError('');
                try {
                    const { error } = await supabaseClient.auth.signInWithPassword({
                        email: adminEmail,
                        password: adminPassword,
                    });
                    if (error) throw error;
                    setAdminPassword('');
                    setShowAuthModal(false);
                    navigateTo('admin');
                } catch (err) {
                    setAuthError(err.message || 'Identifiants invalides.');
                }
            };

            const handleLogout = async () => {
                await supabaseClient.auth.signOut();
                navigateTo('home');
            };

            const handleSaveSettings = async () => {
                const { error } = await supabaseClient.from('settings').upsert([{
                    id: 1,
                    whatsapp_number: settings.whatsappNumber,
                    whatsapp_message: settings.whatsappMessage,
                    messenger_url: settings.messengerUrl,
                    hide_out_of_stock: !!settings.hideOutOfStock
                }]);
                if (error) return alert("Erreur d'enregistrement des paramètres : " + error.message);
                alert('Paramètres enregistrés pour tous les visiteurs !');
            };

            const handleSaveDiyPreset = () => {
                try {
                    localStorage.setItem('esigara_diy_preset_v2', JSON.stringify(diyPresetPrices));
                    alert('Modèle de prix DIY par volume et nicotine enregistré avec succès !');
                } catch (e) {
                    alert('Erreur lors de l\'enregistrement : ' + e.message);
                }
            };

            // Gestion Produit & Variantes / Matrice DIY
            const [editingProductId, setEditingProductId] = useState(null);
            const [newProduct, setNewProduct] = useState(EMPTY_PRODUCT);
            const [variantsList, setVariantsList] = useState([EMPTY_VARIANT()]);

            const [diyBasePrice, setDiyBasePrice] = useState('');
            const [diyUsePreset, setDiyUsePreset] = useState(false);
            const [diySelectedVolumes, setDiySelectedVolumes] = useState({ '10ml': false, '30ml': true, '50ml': true, '100ml': false, '200ml': false, '500ml': false });
            const [diySelectedNicotines, setDiySelectedNicotines] = useState({ '0mg': true, '3mg': true, '6mg': true });

            const resetProductForm = () => {
                setEditingProductId(null);
                setNewProduct(EMPTY_PRODUCT);
                setVariantsList([EMPTY_VARIANT()]);
                setDiyBasePrice('');
                setDiyUsePreset(false);
            };

            const handleLocalImageUpload = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = await uploadImageToSupabase(file);
                    if (url) setNewProduct(prev => ({ ...prev, main_image_url: url }));
                }
            };

            const handleVariantImageUpload = async (varId, e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = await uploadImageToSupabase(file);
                    if (url) setVariantsList(prev => prev.map(v => v.id === varId ? { ...v, image_url: url } : v));
                }
            };

            const addVariantField = () => {
                setVariantsList(prev => [...prev, EMPTY_VARIANT()]);
            };

            const removeVariantField = (id) => {
                if (variantsList.length === 1) return alert('Au moins 1 prix obligatoire.');
                setVariantsList(variantsList.filter(v => v.id !== id));
            };

            const handleVariantChange = (id, field, value) => {
                setVariantsList(prev => prev.map(v => v.id === id ? { ...v, [field]: value } : v));
            };

            const generateDiyVariants = () => {
                const activeVolumes = Object.keys(diySelectedVolumes).filter(k => diySelectedVolumes[k]);
                const activeNicotines = Object.keys(diySelectedNicotines).filter(k => diySelectedNicotines[k]);

                if (activeVolumes.length === 0 && activeNicotines.length === 0) {
                    return alert('Veuillez sélectionner au moins un volume ou un taux de nicotine.');
                }

                const volumes = activeVolumes.length > 0 ? activeVolumes : ['-'];
                const nicotines = activeNicotines.length > 0 ? activeNicotines : ['-'];

                let basePrice = parseFloat(diyBasePrice);
                if (!diyUsePreset && (isNaN(basePrice) || basePrice < 0)) {
                    return alert('Veuillez saisir un prix de base valide.');
                }

                const newVariants = [];
                const missing = [];
                const stamp = Date.now().toString(36);
                let counter = 0;

                volumes.forEach(vol => {
                    nicotines.forEach(nic => {
                        let finalPrice = basePrice;
                        if (diyUsePreset) {
                            const presetValue = parseFloat(diyPresetPrices[`${vol}_${nic}`]);
                            if (isNaN(presetValue)) { missing.push(`${vol} / ${nic}`); return; }
                            finalPrice = presetValue;
                        }

                        newVariants.push({
                            id: `var_gen_${stamp}_${counter++}`,
                            price: String(finalPrice),
                            is_out_of_stock: false,
                            nicotine_level: nic,
                            volume_ml: vol,
                            ohm_value: '-',
                            color_finish: '-',
                            flavor: '-',
                            image_url: ''
                        });
                    });
                });

                if (missing.length > 0) {
                    return alert('Prix manquant dans le modèle DIY (onglet 4) pour : ' + missing.join(', '));
                }

                if (confirm(`Générer ${newVariants.length} déclinaisons basées sur ces choix ? (Ceci remplacera les déclinaisons actuelles du formulaire)`)) {
                    setVariantsList(newVariants);
                }
            };

            const handleSaveProduct = async (e) => {
                e.preventDefault();
                if (!newProduct.name) return alert('Saisissez le nom du produit.');
                if (variantsList.some(v => !v.price || isNaN(parseFloat(v.price)))) {
                    return alert('Chaque déclinaison requiert un prix valide.');
                }

                const productId = editingProductId || Date.now().toString();

                const productPayload = {
                    id: productId,
                    name: newProduct.name,
                    flavor: newProduct.flavor || '',
                    brand_id: newProduct.brand_id || null,
                    category_id: newProduct.category_id || null,
                    short_description: newProduct.short_description || '',
                    box_content: newProduct.box_content || '',
                    main_image_url: newProduct.main_image_url
                };

                const { error: pError } = await supabaseClient.from('products').upsert([productPayload]);
                if (pError) return alert('Erreur produit : ' + pError.message);

                const stamp = Date.now().toString(36);
                const formattedVariants = variantsList.map((v, i) => ({
                    id: v.id.startsWith(`var_${productId}_`) || v.id.startsWith(`var_gen_`) ? v.id : `var_${productId}_${stamp}${i}`,
                    product_id: productId,
                    price: parseFloat(v.price),
                    stock: v.is_out_of_stock ? 0 : 100,
                    nicotine_level: v.nicotine_level || '-',
                    volume_ml: v.volume_ml || '-',
                    ohm_value: v.ohm_value || '-',
                    color_finish: v.color_finish || '-',
                    flavor: v.flavor || '-',
                    image_url: v.image_url || ''
                }));

                const { error: vError } = await supabaseClient.from('variants').upsert(formattedVariants);
                if (vError) return alert('Erreur déclinaisons : ' + vError.message);

                if (editingProductId) {
                    const keepIds = new Set(formattedVariants.map(v => v.id));
                    const oldProduct = products.find(p => p.id === editingProductId);
                    const toDelete = (oldProduct?.variants || []).map(v => v.id).filter(id => !keepIds.has(id));
                    if (toDelete.length > 0) {
                        const { error: dError } = await supabaseClient.from('variants').delete().in('id', toDelete);
                        if (dError) alert('Produit enregistré, mais des anciennes déclinaisons n\'ont pas pu être supprimées : ' + dError.message);
                    }
                }

                alert(editingProductId ? 'Produit mis à jour !' : 'Produit enregistré !');
                resetProductForm();
                loadDataFromSupabase();
            };

            const startEditProduct = (prod) => {
                setEditingProductId(prod.id);
                setNewProduct({
                    name: prod.name,
                    flavor: prod.flavor || '',
                    brand_id: prod.brand_id || '',
                    category_id: prod.category_id || '',
                    short_description: prod.short_description || '',
                    box_content: prod.box_content || '',
                    main_image_url: prod.main_image_url
                });
                setVariantsList(prod.variants.length > 0 ? prod.variants.map(v => ({
                    id: v.id,
                    price: String(v.price),
                    is_out_of_stock: (v.stock ?? 1) === 0,
                    nicotine_level: v.nicotine_level || '-',
                    volume_ml: v.volume_ml || '-',
                    ohm_value: v.ohm_value || '-',
                    color_finish: v.color_finish || '-',
                    flavor: v.flavor || '-',
                    image_url: v.image_url || ''
                })) : [EMPTY_VARIANT()]);
                window.scrollTo(0, 0);
            };

            const deleteProduct = async (id) => {
                if (!confirm('Supprimer ce produit et toutes ses déclinaisons ?')) return;
                const { error: vErr } = await supabaseClient.from('variants').delete().eq('product_id', id);
                if (vErr) return alert('Erreur suppression des déclinaisons : ' + vErr.message);
                const { error } = await supabaseClient.from('products').delete().eq('id', id);
                if (error) return alert('Erreur suppression du produit : ' + error.message);
                if (editingProductId === id) resetProductForm();
                setCart(prev => prev.filter(i => i.productId !== id));
                loadDataFromSupabase();
            };

            const [newBrandName, setNewBrandName] = useState('');
            const [newBrandDesc, setNewBrandDesc] = useState('');
            const [newBrandLogo, setNewBrandLogo] = useState(DEFAULT_LOGO);

            const handleBrandLogoUpload = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = await uploadImageToSupabase(file);
                    if (url) setNewBrandLogo(url);
                }
            };

            const handleAddBrand = async (e) => {
                e.preventDefault();
                if (!newBrandName) return;
                const brandObj = {
                    id: 'b_' + Date.now(),
                    name: newBrandName,
                    slug: newBrandName.toLowerCase().replace(/\s+/g, '-'),
                    description: newBrandDesc,
                    logo_url: newBrandLogo
                };
                const { error } = await supabaseClient.from('brands').insert([brandObj]);
                if (error) return alert('Erreur : ' + error.message);

                setNewBrandName('');
                setNewBrandDesc('');
                setNewBrandLogo(DEFAULT_LOGO);
                alert('Marque ajoutée !');
                loadDataFromSupabase();
            };

            const deleteBrand = async (id) => {
                const count = products.filter(p => p.brand_id === id).length;
                if (!confirm(count > 0
                    ? `Supprimer cette marque ? ${count} produit(s) seront conservés mais sans marque.`
                    : 'Supprimer cette marque ?')) return;
                const { error: uErr } = await supabaseClient.from('products').update({ brand_id: null }).eq('brand_id', id);
                if (uErr) return alert('Erreur : ' + uErr.message);
                const { error } = await supabaseClient.from('brands').delete().eq('id', id);
                if (error) return alert('Erreur suppression de la marque : ' + error.message);
                loadDataFromSupabase();
            };

            const [editingCatId, setEditingCatId] = useState(null);
            const [newCatName, setNewCatName] = useState('');
            const [newCatParent, setNewCatParent] = useState('');
            const [newCatImage, setNewCatImage] = useState(DEFAULT_CAT_IMG);
            const [newCatOrder, setNewCatOrder] = useState('0');
            const [newCatPriceTable, setNewCatPriceTable] = useState([{ label: '', price: '' }]);

            const getAllChildCategoryIds = (catId, seen = new Set()) => {
                if (seen.has(catId)) return [];
                seen.add(catId);
                let ids = [catId];
                categories.filter(c => c.parent_id === catId).forEach(child => {
                    ids = ids.concat(getAllChildCategoryIds(child.id, seen));
                });
                return ids;
            };

            const resetCategoryForm = () => {
                setEditingCatId(null);
                setNewCatName('');
                setNewCatParent('');
                setNewCatImage(DEFAULT_CAT_IMG);
                setNewCatOrder('0');
                setNewCatPriceTable([{ label: '', price: '' }]);
            };

            const handleLocalCatImageUpload = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = await uploadImageToSupabase(file);
                    if (url) setNewCatImage(url);
                }
            };

            const handleSaveCategory = async (e) => {
                e.preventDefault();
                if (!newCatName) return;

                if (editingCatId && newCatParent && getAllChildCategoryIds(editingCatId).includes(newCatParent)) {
                    return alert('Un dossier ne peut pas être rangé dans lui-même ou dans un de ses sous-dossiers.');
                }

                const filteredPriceTable = newCatPriceTable.filter(row => row.label.trim() !== '' || String(row.price).trim() !== '');

                const catObj = {
                    id: editingCatId || ('c_' + Date.now()),
                    parent_id: newCatParent === '' ? null : newCatParent,
                    name: newCatName,
                    slug: newCatName.toLowerCase().replace(/\s+/g, '-'),
                    image: newCatImage,
                    display_order: parseInt(newCatOrder) || 0,
                    price_table: filteredPriceTable
                };

                const { error } = await supabaseClient.from('categories').upsert([catObj]);
                if (error) return alert('Erreur : ' + error.message);

                resetCategoryForm();
                alert('Rubrique enregistrée !');
                loadDataFromSupabase();
            };

            const startAddSubCategory = (parentCat) => {
                resetCategoryForm();
                setNewCatParent(parentCat.id);
            };

            const startEditCategory = (cat) => {
                setEditingCatId(cat.id);
                setNewCatName(cat.name);
                setNewCatParent(cat.parent_id || '');
                setNewCatImage(cat.image || DEFAULT_CAT_IMG);
                setNewCatOrder(String(cat.display_order ?? 0));
                setNewCatPriceTable(cat.price_table && cat.price_table.length > 0 ? cat.price_table : [{ label: '', price: '' }]);
            };

            const moveCategoryOrder = async (cat, direction) => {
                const siblings = sortCategories(categories.filter(c => (c.parent_id || null) === (cat.parent_id || null)));
                const idx = siblings.findIndex(c => c.id === cat.id);
                const target = idx + direction;
                if (idx < 0 || target < 0 || target >= siblings.length) return;

                const reordered = siblings.slice();
                [reordered[idx], reordered[target]] = [reordered[target], reordered[idx]];

                // Affichage immédiat, puis enregistrement
                const newOrderById = {};
                reordered.forEach((c, i) => { newOrderById[c.id] = i; });
                setCategories(prev => sortCategories(prev.map(c => c.id in newOrderById ? { ...c, display_order: newOrderById[c.id] } : c)));

                const jobs = reordered
                    .filter((c, i) => (c.display_order ?? 0) !== i || c.id === cat.id)
                    .map(c => supabaseClient.from('categories').update({ display_order: newOrderById[c.id] }).eq('id', c.id));
                const results = await Promise.all(jobs);
                const failed = results.find(r => r.error);
                if (failed) alert("Erreur lors de la modification de l'ordre : " + failed.error.message + "\n(La colonne display_order existe-t-elle dans Supabase ?)");
                loadDataFromSupabase();
            };

            const deleteCategory = async (id) => {
                const cat = categories.find(c => c.id === id);
                const newParent = cat?.parent_id || null;
                const childCount = categories.filter(c => c.parent_id === id).length;
                const prodCount = products.filter(p => p.category_id === id).length;
                if (!confirm(`Supprimer cette rubrique ?\n- ${childCount} sous-dossier(s) et ${prodCount} produit(s) seront remontés ${newParent ? 'dans le dossier parent' : 'à la racine / non classés'}.`)) return;

                const { error: e1 } = await supabaseClient.from('categories').update({ parent_id: newParent }).eq('parent_id', id);
                if (e1) return alert('Erreur : ' + e1.message);
                const { error: e2 } = await supabaseClient.from('products').update({ category_id: newParent }).eq('category_id', id);
                if (e2) return alert('Erreur : ' + e2.message);
                const { error } = await supabaseClient.from('categories').delete().eq('id', id);
                if (error) return alert('Erreur suppression de la rubrique : ' + error.message);

                if (editingCatId === id) resetCategoryForm();
                loadDataFromSupabase();
            };

            const [bulkBrandId, setBulkBrandId] = useState('');
            const [bulkCategoryId, setBulkCategoryId] = useState('');
            const [bulkValue, setBulkValue] = useState('');
            const [bulkBusy, setBulkBusy] = useState(false);

            // Configurateur de tableau de prix d'un dossier (affiché en haut de la page du dossier)
            const [ptCatId, setPtCatId] = useState('');
            const [ptRows, setPtRows] = useState([{ label: '', price: '' }]);
            const [ptBusy, setPtBusy] = useState(false);

            const selectPriceTableCategory = (catId) => {
                setPtCatId(catId);
                const cat = categories.find(c => c.id === catId);
                const rows = cat && Array.isArray(cat.price_table) && cat.price_table.length > 0
                    ? cat.price_table.map(r => ({ label: r.label || '', price: r.price ?? '' }))
                    : [{ label: '', price: '' }];
                setPtRows(rows);
            };

            const savePriceTable = async (rows, successMessage) => {
                if (!ptCatId) return alert('Veuillez choisir un dossier.');
                setPtBusy(true);
                try {
                    const { error } = await supabaseClient.from('categories').update({ price_table: rows }).eq('id', ptCatId);
                    if (error) return alert('Erreur : ' + error.message);
                    alert(successMessage);
                    await loadDataFromSupabase();
                    if (rows.length === 0) setPtRows([{ label: '', price: '' }]);
                } finally {
                    setPtBusy(false);
                }
            };

            const handleSavePriceTable = () => {
                const rows = ptRows
                    .map(r => ({ label: r.label.trim(), price: String(r.price).trim() }))
                    .filter(r => r.label !== '' || r.price !== '');
                if (rows.length === 0) return alert('Ajoutez au moins une ligne, ou utilisez « Retirer le tableau ».');
                if (rows.some(r => r.label === '')) return alert('Chaque ligne doit avoir une désignation.');
                savePriceTable(rows, 'Tableau de prix enregistré ! Il s\'affiche en haut de la page du dossier.');
            };

            const handleDeletePriceTable = () => {
                if (!confirm('Retirer le tableau de prix de ce dossier ?')) return;
                savePriceTable([], 'Tableau de prix retiré.');
            };

            // Application du modèle de prix DIY à tous les produits d'un dossier
            const [diyBulkCatId, setDiyBulkCatId] = useState('');
            const [diyBulkVols, setDiyBulkVols] = useState(() => Object.fromEntries(DIY_VOLUMES.map(v => [v, true])));
            const [diyBulkNics, setDiyBulkNics] = useState(() => Object.fromEntries(DIY_NICOTINES.map(n => [n, true])));
            const [diyBulkBusy, setDiyBulkBusy] = useState(false);

            const handleApplyDiyToCategory = async () => {
                if (!diyBulkCatId) return alert('Choisissez le dossier cible (ex : E-liquide DIY).');
                const vols = DIY_VOLUMES.filter(v => diyBulkVols[v]);
                const nics = DIY_NICOTINES.filter(n => diyBulkNics[n]);

                const combos = [];
                vols.forEach(vol => nics.forEach(nic => {
                    const price = parseFloat(diyPresetPrices[`${vol}_${nic}`]);
                    if (!isNaN(price) && price >= 0) combos.push({ vol, nic, price });
                }));
                if (combos.length === 0) return alert("Aucun prix défini pour ces choix. Renseignez d'abord le modèle de prix (onglet 4).");

                const catIds = getAllChildCategoryIds(diyBulkCatId);
                const targets = products.filter(p => catIds.includes(p.category_id));
                if (targets.length === 0) return alert('Aucun produit dans ce dossier.');

                const updates = new Map(); // prix -> identifiants de déclinaisons à mettre à jour
                const creations = [];
                let updateCount = 0;
                targets.forEach(p => combos.forEach(({ vol, nic, price }) => {
                    const matches = p.variants.filter(v => v.volume_ml === vol && v.nicotine_level === nic);
                    if (matches.length > 0) {
                        matches.forEach(v => {
                            if ((Number(v.price) || 0) === price) return;
                            if (!updates.has(price)) updates.set(price, []);
                            updates.get(price).push(v.id);
                            updateCount++;
                        });
                    } else {
                        creations.push({
                            id: `var_${p.id}_diy_${vol}_${nic}`,
                            product_id: p.id,
                            price,
                            stock: 100,
                            nicotine_level: nic,
                            volume_ml: vol,
                            ohm_value: '-',
                            color_finish: '-',
                            flavor: '-',
                            image_url: ''
                        });
                    }
                }));

                if (updateCount === 0 && creations.length === 0) return alert('Tous les produits de ce dossier ont déjà ces prix.');
                if (!confirm(`${targets.length} produit(s) dans ce dossier :\n- ${updateCount} prix mis à jour\n- ${creations.length} déclinaison(s) créée(s)\nLes autres déclinaisons ne sont pas modifiées.\nConfirmer ?`)) return;

                setDiyBulkBusy(true);
                try {
                    const jobs = [];
                    updates.forEach((ids, price) => {
                        for (let i = 0; i < ids.length; i += 100) {
                            jobs.push(supabaseClient.from('variants').update({ price }).in('id', ids.slice(i, i + 100)));
                        }
                    });
                    for (let i = 0; i < creations.length; i += 200) {
                        jobs.push(supabaseClient.from('variants').upsert(creations.slice(i, i + 200)));
                    }
                    const results = await Promise.all(jobs);
                    const failed = results.filter(r => r.error);
                    if (failed.length > 0) {
                        alert(`Terminé avec ${failed.length} erreur(s) : ${failed[0].error.message}`);
                    } else {
                        alert(`Modèle DIY appliqué : ${updateCount} prix mis à jour, ${creations.length} déclinaison(s) créée(s).`);
                    }
                } catch (err) {
                    alert('Erreur : ' + err.message);
                } finally {
                    setDiyBulkBusy(false);
                    loadDataFromSupabase();
                }
            };


            const handleBulkPriceUpdate = async (e) => {
                e.preventDefault();
                const newPrice = parseFloat(bulkValue);
                if (isNaN(newPrice) || newPrice < 0) return alert('Veuillez saisir un prix valide.');
                if (!bulkBrandId && !bulkCategoryId) {
                    return alert('Veuillez sélectionner au moins une marque ou un dossier cible.');
                }

                let targetProducts = products;
                if (bulkBrandId) targetProducts = targetProducts.filter(p => p.brand_id === bulkBrandId);
                if (bulkCategoryId) {
                    const validCatIds = getAllChildCategoryIds(bulkCategoryId);
                    targetProducts = targetProducts.filter(p => validCatIds.includes(p.category_id));
                }
                if (targetProducts.length === 0) return alert('Aucun produit ne correspond à ces critères.');

                const changes = new Map();
                let count = 0;
                targetProducts.forEach(prod => prod.variants.forEach(v => {
                    if ((Number(v.price) || 0) === newPrice) return;
                    if (!changes.has(newPrice)) changes.set(newPrice, []);
                    changes.get(newPrice).push(v.id);
                    count++;
                }));

                if (count === 0) return alert('Tous les produits ciblés ont déjà ce prix.');
                if (!confirm(`Le prix de ${count} déclinaison(s) (${targetProducts.length} produit(s)) sera fixé à ${fmt(newPrice)} Ar.\nConfirmer ?`)) return;

                setBulkBusy(true);
                try {
                    const jobs = [];
                    changes.forEach((ids, price) => {
                        for (let i = 0; i < ids.length; i += 100) {
                            jobs.push(supabaseClient.from('variants').update({ price }).in('id', ids.slice(i, i + 100)));
                        }
                    });
                    const results = await Promise.all(jobs);
                    const failed = results.filter(r => r.error);
                    if (failed.length > 0) {
                        alert(`Terminé avec ${failed.length} erreur(s).`);
                    } else {
                        alert(`Changement collectif effectué : ${count} déclinaison(s) mise(s) à jour.`);
                        setBulkValue('');
                    }
                } catch (err) {
                    alert('Erreur : ' + err.message);
                } finally {
                    setBulkBusy(false);
                    loadDataFromSupabase();
                }
            };

            const activeCategory = categories.find(c => c.id === selectedCategoryId);
            const activeBrand = brands.find(b => b.id === selectedBrandId);
            const selectedProduct = products.find(p => p.id === selectedProductId);

            const queryWords = norm(searchQuery).trim().split(/\s+/).filter(Boolean);
            const searchResults = queryWords.length === 0 ? [] : products.filter(p => {
                if (!isVisible(p)) return false;
                const brand = brands.find(b => b.id === p.brand_id);
                const category = categories.find(c => c.id === p.category_id);
                const searchableText = norm([
                    p.name,
                    p.flavor,
                    p.short_description,
                    p.box_content,
                    brand ? brand.name : '',
                    category ? category.name : '',
                    ...p.variants.map(v => `${v.flavor} ${v.nicotine_level} ${v.volume_ml} ${v.color_finish} ${v.ohm_value}`)
                ].join(' '));
                return queryWords.every(word => searchableText.includes(word));
            });

            const renderCard = (product) => (
                <ProductCard
                    key={product.id}
                    product={product}
                    brand={brands.find(b => b.id === product.brand_id)}
                    hideOutOfStock={hideOutOfStock}
                    selectedVarId={selectedVariantByProduct[product.id]}
                    onSelectVariant={onSelectVariant}
                    qty={quantityByProduct[product.id] || 1}
                    onQty={onQty}
                    onOpen={openProduct}
                    onAdd={addToCart}
                />
            );

            const gridClass = "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6";
            const uncategorizedProducts = products.filter(p => !p.category_id || !categories.some(c => c.id === p.category_id));

            const renderAdminProductRow = (p) => (
                <div key={p.id} className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
                    <div className="flex items-center space-x-3">
                        <div className="w-10 h-10 bg-white rounded-lg border border-slate-800 flex items-center justify-center p-1">
                            <img src={p.main_image_url} alt={p.name} loading="lazy" className="max-w-full max-h-full object-contain" />
                        </div>
                        <div>
                            <h4 className="font-bold text-xs text-slate-200">{p.name}</h4>
                            <p className="text-[10px] text-slate-400">{p.variants.length} option(s) tarifaire(s)</p>
                        </div>
                    </div>
                    <div className="flex items-center space-x-2">
                        <button onClick={() => startEditProduct(p)} className="px-2.5 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-lg text-xs font-bold">Modifier</button>
                        <button onClick={() => deleteProduct(p.id)} className="px-2.5 py-1 bg-rose-500/10 text-rose-400 border border-rose-500/30 rounded-lg text-xs font-bold">Supprimer</button>
                    </div>
                </div>
            );

            const excludedParentIds = editingCatId ? getAllChildCategoryIds(editingCatId) : [];

            return (
                <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
                    {!isAgeVerified && (
                        <div className="fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl text-center space-y-6">
                                <div className="w-16 h-16 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center mx-auto text-rose-500 font-black text-2xl">
                                    18+
                                </div>
                                <div className="space-y-2">
                                    <h2 className="text-xl font-black text-slate-100">Avertissement Légal</h2>
                                    <p className="text-xs text-slate-400 leading-relaxed">
                                        Les produits contenus sur <strong className="text-teal-400">Esigara.mg</strong> sont strictement réservés aux personnes majeures.
                                    </p>
                                    <p className="text-xs text-slate-300 font-semibold pt-2">
                                        Certifiez-vous avoir 18 ans ou plus ?
                                    </p>
                                </div>
                                <div className="space-y-2.5">
                                    <button
                                        onClick={confirmAge}
                                        className="w-full py-3.5 bg-teal-500 hover:bg-teal-400 text-black font-black text-xs uppercase tracking-wider rounded-2xl shadow-lg shadow-teal-500/25 transition">
                                        J'ai 18 ans ou plus (Entrer)
                                    </button>
                                    <button
                                        onClick={() => window.location.href = "https://www.google.com"}
                                        className="w-full py-3 bg-slate-950 hover:bg-slate-800 text-slate-400 font-bold text-xs rounded-2xl transition border border-slate-800">
                                        Quitter le site
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="border-b border-slate-800/80 bg-slate-900/80 sticky top-0 z-40 backdrop-blur-md">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex items-center space-x-3 cursor-pointer w-full sm:w-auto justify-between sm:justify-start" onClick={() => navigateTo('home')}>
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-teal-500/20">
                                        <svg className="w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                                    </div>
                                    <div>
                                        <div className="flex items-center space-x-1.5">
                                            <span className="text-xl font-extrabold tracking-tight bg-gradient-to-r from-teal-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">ESIGARA.MG</span>
                                            <span className="text-[9px] font-black bg-rose-500/20 text-rose-400 border border-rose-500/30 px-1.5 py-0.5 rounded-full">18+</span>
                                        </div>
                                        <p className="text-[10px] text-slate-400 font-medium tracking-wider uppercase">Madagascar Vape Shop</p>
                                    </div>
                                </div>
                            </div>

                            <form onSubmit={handleSearchSubmit} className="relative w-full sm:max-w-md">
                                <input
                                    type="text"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="Rechercher un produit, une saveur, une marque..."
                                    className="w-full bg-slate-950/90 border border-slate-800 rounded-2xl pl-10 pr-24 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-teal-500 transition shadow-inner"
                                />
                                <svg className="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                                <button type="submit" className="absolute right-1.5 top-1.5 bg-teal-500 hover:bg-teal-400 text-black px-3 py-1.5 rounded-xl text-[11px] font-bold transition">
                                    Rechercher
                                </button>
                            </form>

                            <div className="flex items-center space-x-3 w-full sm:w-auto justify-end">
                                <button
                                    onClick={toggleTheme}
                                    title={theme === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre'}
                                    aria-label={theme === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre'}
                                    className="w-9 h-9 shrink-0 flex items-center justify-center bg-slate-900 border border-slate-800 rounded-xl text-amber-400 hover:border-teal-500 transition">
                                    {theme === 'dark' ? (
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" strokeWidth="2"/><path strokeLinecap="round" strokeWidth="2" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4l1.4-1.4"/></svg>
                                    ) : (
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.35 15.35A8 8 0 118.65 3.65a6.5 6.5 0 0011.7 11.7z"/></svg>
                                    )}
                                </button>
                                {currentView !== 'home' && (
                                    <button onClick={() => navigateTo('home')} className="px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800">
                                        &larr; Accueil
                                    </button>
                                )}

                                <button
                                    onClick={() => { setCartNotice(null); setShowCartModal(true); }}
                                    className="relative px-4 py-2 bg-teal-500 hover:bg-teal-400 text-black rounded-2xl font-bold text-xs flex items-center space-x-2 transition shadow-lg shadow-teal-500/20">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
