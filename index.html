<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esigara.mg - E-commerce Vape Madagascar</title>
    
    <!-- Balises Anti-Cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel pour JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Client Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-teal-500 selection:text-slate-950 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Configuration Supabase
        const SUPABASE_URL = "https://fcagaagjkgwejtnvdzoj.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oiiGr4O_j3Qs-udNt8if5w_SOPD-VG4";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            // Vérification de l'âge (+18 ans)
            const [isAgeVerified, setIsAgeVerified] = useState(false);

            useEffect(() => {
                const ageConfirmed = localStorage.getItem('esigara_age_verified');
                if (ageConfirmed === 'true') {
                    setIsAgeVerified(true);
                }
            }, []);

            const confirmAge = () => {
                localStorage.setItem('esigara_age_verified', 'true');
                setIsAgeVerified(true);
            };

            const [currentView, setCurrentView] = useState('home'); 
            const [selectedCategoryId, setSelectedCategoryId] = useState(null);
            const [selectedBrandId, setSelectedBrandId] = useState(null);
            
            const [searchQuery, setSearchQuery] = useState('');
            const [showCartModal, setShowCartModal] = useState(false);
            const [selectedProductModal, setSelectedProductModal] = useState(null);
            const [isLoading, setIsLoading] = useState(true);

            // Données réelles chargées depuis Supabase
            const [brands, setBrands] = useState([]);
            const [categories, setCategories] = useState([]);
            const [products, setProducts] = useState([]);

            // Configuration DIY globale indépendante (stockée dans localStorage)
            const [diyGlobalConfig, setDiyGlobalConfig] = useState(() => {
                const saved = localStorage.getItem('esigara_diy_global_config');
                return saved ? JSON.parse(saved) : {
                    basePrice10ml: 15000,
                    nicotineBonuses: { '0mg': 0, '3mg': 2000, '6mg': 4000, '12mg': 6000, '18mg': 8000, '20mg': 10000 },
                    volumeMultipliers: { '10ml': 1, '30ml': 3, '50ml': 5, '100ml': 10 }
                };
            });

            const saveDiyGlobalConfig = (newConfig) => {
                setDiyGlobalConfig(newConfig);
                localStorage.setItem('esigara_diy_global_config', JSON.stringify(newConfig));
                alert('Configuration DIY enregistrée avec succès !');
            };

            // Option globale pour masquer les produits en rupture
            const [hideOutOfStock, setHideOutOfStock] = useState(() => {
                return localStorage.getItem('esigara_hide_out_of_stock') === 'true';
            });

            const handleToggleHideOutOfStock = (val) => {
                setHideOutOfStock(val);
                localStorage.setItem('esigara_hide_out_of_stock', val ? 'true' : 'false');
            };

            // Charger l'ensemble des données depuis Supabase au démarrage
            const loadDataFromSupabase = async () => {
                setIsLoading(true);
                try {
                    const { data: bData } = await supabaseClient.from('brands').select('*');
                    if (bData) setBrands(bData);

                    const { data: cData } = await supabaseClient.from('categories').select('*');
                    if (cData) setCategories(cData);

                    const { data: pData } = await supabaseClient.from('products').select('*');
                    const { data: vData } = await supabaseClient.from('variants').select('*');

                    if (pData) {
                        const fullProducts = pData.map(p => ({
                            ...p,
                            variants: (vData || []).filter(v => v.product_id === p.id)
                        }));
                        setProducts(fullProducts);
                    }
                } catch (err) {
                    console.error("Erreur de chargement Supabase :", err);
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                loadDataFromSupabase();
            }, []);

            // Support du bouton retour
            useEffect(() => {
                const handlePopState = (event) => {
                    if (event.state) {
                        setCurrentView(event.state.view || 'home');
                        setSelectedCategoryId(event.state.categoryId || null);
                        setSelectedBrandId(event.state.brandId || null);
                        setSearchQuery(event.state.searchQuery || '');
                    } else {
                        setCurrentView('home');
                        setSelectedCategoryId(null);
                        setSelectedBrandId(null);
                        setSearchQuery('');
                    }
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            const navigateTo = (view, catId = null, brandId = null, query = '') => {
                window.history.pushState({ view, categoryId: catId, brandId, searchQuery: query }, '', `#${view}`);
                setCurrentView(view);
                setSelectedCategoryId(catId);
                setSelectedBrandId(brandId);
                if (query !== '') setSearchQuery(query);
            };

            const handleSearchSubmit = (e) => {
                e.preventDefault();
                if (searchQuery.trim()) {
                    navigateTo('search', null, null, searchQuery);
                }
            };
            
            const [adminUnlocked, setAdminUnlocked] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [adminEmail, setAdminEmail] = useState('');
            const [adminPassword, setAdminPassword] = useState('');
            const [authError, setAuthError] = useState('');

            const [adminTab, setAdminTab] = useState('products');

            const [settings, setSettings] = useState({
                whatsappNumber: '+261340000000',
                whatsappMessage: 'Bonjour Esigara.mg, je souhaite finaliser ma commande :',
                messengerUrl: 'https://m.me/esigaramg'
            });

            // Formulaires d'administration Produit
            const [editingProductId, setEditingProductId] = useState(null);
            const [newProduct, setNewProduct] = useState({
                name: '', brand_id: '', category_id: '', short_description: '', box_content: '', main_image_url: 'https://images.unsplash.com/photo-1539185441755-769473a23570?auto=format&fit=crop&w=600&q=80'
            });
            
            const [variantsList, setVariantsList] = useState([
                { id: 'var_1', price: '', is_out_of_stock: false, nicotine_level: '-', volume_ml: '-', ohm_value: '-', color_finish: '-', flavor: '-', image_url: '' }
            ]);

            const [isDiyProductChecked, setIsDiyProductChecked] = useState(false);

            // Calcul du prix automatique DIY basé sur la configuration globale indépendante
            const calculateDiyVariantPrice = (volStr, nicStr) => {
                const volVal = parseInt(volStr) || 10;
                const multiplier = diyGlobalConfig.volumeMultipliers[volStr] || (volVal / 10);
                const nicBonus = diyGlobalConfig.nicotineBonuses[nicStr] || 0;
                return Math.round((diyGlobalConfig.basePrice10ml * multiplier) + nicBonus);
            };

            const applyGlobalDiyToVariants = () => {
                const volumes = ['10ml', '30ml', '50ml', '100ml'];
                const nicotines = ['0mg', '3mg', '6mg', '12mg', '18mg', '20mg'];
                const generated = [];

                volumes.forEach(vol => {
                    nicotines.forEach(nic => {
                        const calculatedPrice = calculateDiyVariantPrice(vol, nic);
                        generated.push({
                            id: 'diy_' + vol + '_' + nic + '_' + Date.now(),
                            price: calculatedPrice.toString(),
                            is_out_of_stock: false,
                            nicotine_level: nic,
                            volume_ml: vol,
                            ohm_value: '-',
                            color_finish: '-',
                            flavor: 'Sur Mesure (DIY)',
                            image_url: ''
                        });
                    });
                });

                setVariantsList(generated);
                alert('Grille tarifaire DIY appliquée automatiquement depuis la configuration globale !');
            };

            const [newBrandName, setNewBrandName] = useState('');
            const [newBrandDesc, setNewBrandDesc] = useState('');
            const [newBrandLogo, setNewBrandLogo] = useState('https://images.unsplash.com/photo-1539185441755-769473a23570?auto=format&fit=crop&w=200&q=80');
            
            const [editingCatId, setEditingCatId] = useState(null);
            const [newCatName, setNewCatName] = useState('');
            const [newCatParent, setNewCatParent] = useState('');
            const [newCatImage, setNewCatImage] = useState('https://images.unsplash.com/photo-1527661591475-527312dd65f5?auto=format&fit=crop&w=600&q=80');

            const [cart, setCart] = useState([]);
            const [selectedVariantByProduct, setSelectedVariantByProduct] = useState({});
            const [quantityByProduct, setQuantityByProduct] = useState({});

            const handleSupabaseLogin = async (e) => {
                e.preventDefault();
                setAuthError('');
                try {
                    const { error } = await supabaseClient.auth.signInWithPassword({
                        email: adminEmail,
                        password: adminPassword,
                    });
                    if (error) throw error;
                    setAdminUnlocked(true);
                    setShowAuthModal(false);
                    navigateTo('admin');
                } catch (err) {
                    setAuthError(err.message || 'Identifiants invalides.');
                }
            };

            const handleLocalImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setNewProduct({ ...newProduct, main_image_url: reader.result });
                    reader.readAsDataURL(file);
                }
            };

            const handleVariantImageUpload = (varId, e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setVariantsList(variantsList.map(v => v.id === varId ? { ...v, image_url: reader.result } : v));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleBrandLogoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setNewBrandLogo(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleLocalCatImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setNewCatImage(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const addVariantField = () => {
                setVariantsList([...variantsList, { id: 'var_' + Date.now(), price: '', is_out_of_stock: false, nicotine_level: '-', volume_ml: '-', ohm_value: '-', color_finish: '-', flavor: '-', image_url: '' }]);
            };

            const removeVariantField = (id) => {
                if (variantsList.length === 1) return alert('Le produit doit avoir au moins un tarif/prix principal.');
                setVariantsList(variantsList.filter(v => v.id !== id));
            };

            const handleVariantChange = (id, field, value) => {
                setVariantsList(variantsList.map(v => v.id === id ? { ...v, [field]: value } : v));
            };

            const handleSaveProduct = async (e) => {
                e.preventDefault();
                if (!newProduct.name) return alert('Veuillez spécifier le nom du produit.');
                if (variantsList.some(v => !v.price || isNaN(parseFloat(v.price)))) {
                    return alert('Chaque déclinaison doit posséder au moins un prix valide.');
                }

                const productId = editingProductId || Date.now().toString();

                const { error: pError } = await supabaseClient.from('products').upsert([{
                    id: productId,
                    name: newProduct.name,
                    brand_id: newProduct.brand_id || null,
                    category_id: newProduct.category_id || null,
                    short_description: newProduct.short_description || '',
                    box_content: newProduct.box_content || '',
                    main_image_url: newProduct.main_image_url
                }]);

                if (pError) return alert('Erreur enregistrement produit : ' + pError.message);

                if (editingProductId) {
                    await supabaseClient.from('variants').delete().eq('product_id', productId);
                }

                const formattedVariants = variantsList.map((v, i) => ({
                    id: 'var_' + productId + '_' + i,
                    product_id: productId,
                    price: parseFloat(v.price),
                    stock: v.is_out_of_stock ? 0 : 100, // Remplacement stock par is_out_of_stock
                    nicotine_level: v.nicotine_level || '-',
                    volume_ml: v.volume_ml || '-',
                    ohm_value: v.ohm_value || '-',
                    color_finish: v.color_finish || '-',
                    flavor: v.flavor || '-',
                    image_url: v.image_url || ''
                }));

                const { error: vError } = await supabaseClient.from('variants').insert(formattedVariants);

                if (vError) return alert('Erreur enregistrement variantes : ' + vError.message);

                alert(editingProductId ? 'Produit mis à jour avec succès !' : 'Produit enregistré avec succès !');
                setEditingProductId(null);
                setNewProduct({ name: '', brand_id: '', category_id: '', short_description: '', box_content: '', main_image_url: 'https://images.unsplash.com/photo-1539185441755-769473a23570?auto=format&fit=crop&w=600&q=80' });
                setVariantsList([{ id: 'var_1', price: '', is_out_of_stock: false, nicotine_level: '-', volume_ml: '-', ohm_value: '-', color_finish: '-', flavor: '-', image_url: '' }]);
                setIsDiyProductChecked(false);
                loadDataFromSupabase();
            };

            const startEditProduct = (prod) => {
                setEditingProductId(prod.id);
                setNewProduct({
                    name: prod.name,
                    brand_id: prod.brand_id || '',
                    category_id: prod.category_id || '',
                    short_description: prod.short_description || '',
                    box_content: prod.box_content || '',
                    main_image_url: prod.main_image_url
                });
                setVariantsList(prod.variants.map(v => ({
                    id: v.id,
                    price: v.price.toString(),
                    is_out_of_stock: (v.stock ?? 1) === 0,
                    nicotine_level: v.nicotine_level || '-',
                    volume_ml: v.volume_ml || '-',
                    ohm_value: v.ohm_value || '-',
                    color_finish: v.color_finish || '-',
                    flavor: v.flavor || '-',
                    image_url: v.image_url || ''
                })));
            };

            const deleteProduct = async (id) => {
                if (confirm('Voulez-vous vraiment supprimer ce produit ?')) {
                    await supabaseClient.from('products').delete().eq('id', id);
                    loadDataFromSupabase();
                }
            };

            const handleAddBrand = async (e) => {
                e.preventDefault();
                if (!newBrandName) return;
                const brandObj = {
                    id: 'b_' + Date.now(),
                    name: newBrandName,
                    slug: newBrandName.toLowerCase().replace(/\s+/g, '-'),
                    description: newBrandDesc,
                    logo_url: newBrandLogo
                };
                const { error } = await supabaseClient.from('brands').insert([brandObj]);
                if (error) return alert('Erreur : ' + error.message);
                
                setNewBrandName(''); 
                setNewBrandDesc('');
                setNewBrandLogo('https://images.unsplash.com/photo-1539185441755-769473a23570?auto=format&fit=crop&w=200&q=80');
                alert('Marque ajoutée avec succès !');
                loadDataFromSupabase();
            };

            const deleteBrand = async (id) => {
                if (confirm('Voulez-vous vraiment supprimer cette marque ?')) {
                    await supabaseClient.from('brands').delete().eq('id', id);
                    loadDataFromSupabase();
                }
            };

            const handleSaveCategory = async (e) => {
                e.preventDefault();
                if (!newCatName) return;

                const catObj = {
                    id: editingCatId || ('c_' + Date.now()),
                    parent_id: newCatParent === '' ? null : newCatParent,
                    name: newCatName,
                    slug: newCatName.toLowerCase().replace(/\s+/g, '-'),
                    image: newCatImage
                };

                const { error } = await supabaseClient.from('categories').upsert([catObj]);
                if (error) return alert('Erreur : ' + error.message);

                setEditingCatId(null);
                setNewCatName('');
                setNewCatParent('');
                setNewCatImage('https://images.unsplash.com/photo-1527661591475-527312dd65f5?auto=format&fit=crop&w=600&q=80');
                alert(newCatParent ? 'Dossier / sous-rubrique enregistré !' : 'Rubrique principale enregistrée !');
                loadDataFromSupabase();
            };

            const startAddSubCategory = (parentCat) => {
                setEditingCatId(null);
                setNewCatName('');
                setNewCatParent(parentCat.id);
                setNewCatImage('https://images.unsplash.com/photo-1527661591475-527312dd65f5?auto=format&fit=crop&w=600&q=80');
            };

            const startEditCategory = (cat) => {
                setEditingCatId(cat.id);
                setNewCatName(cat.name);
                setNewCatParent(cat.parent_id || '');
                setNewCatImage(cat.image);
            };

            const deleteCategory = async (id) => {
                if (confirm('Voulez-vous supprimer cette rubrique ou ce dossier ? Les sous-dossiers et éléments rattachés seront également impactés.')) {
                    await supabaseClient.from('categories').delete().eq('id', id);
                    loadDataFromSupabase();
                }
            };

            const getAllChildCategoryIds = (catId) => {
                let ids = [catId];
                const directChildren = categories.filter(c => c.parent_id === catId);
                directChildren.forEach(child => {
                    ids = ids.concat(getAllChildCategoryIds(child.id));
                });
                return ids;
            };

            const CategoryTreeItem = ({ category, depth = 0 }) => {
                const subCats = categories.filter(sub => sub.parent_id === category.id);
                return (
                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                                <div className="w-8 h-8 rounded-lg border border-slate-800 bg-white flex items-center justify-center p-0.5">
                                    <img src={category.image} alt={category.name} className="max-w-full max-h-full object-contain" />
                                </div>
                                <span className={`font-extrabold text-xs ${depth === 0 ? 'text-teal-400' : 'text-slate-200'}`}>
                                    {depth > 0 && <span className="text-slate-500 mr-1">↳</span>}
                                    {category.name}
                                </span>
                            </div>
                            <div className="flex items-center space-x-1">
                                <button onClick={() => startAddSubCategory(category)} className="px-2 py-1 bg-teal-500/10 text-teal-400 rounded-lg text-[10px] font-bold border border-teal-500/20">
                                    + Dossier enfant
                                </button>
                                <button onClick={() => startEditCategory(category)} className="px-2 py-1 bg-amber-500/10 text-amber-400 rounded-lg text-[10px] font-bold">
                                    Editer
                                </button>
                                <button onClick={() => deleteCategory(category.id)} className="px-2 py-1 bg-rose-500/10 text-rose-400 rounded-lg text-[10px] font-bold">
                                    Supprimer
                                </button>
                            </div>
                        </div>

                        {subCats.length > 0 && (
                            <div className="pl-4 border-l-2 border-slate-800 space-y-2 pt-1">
                                {subCats.map(sub => (
                                    <CategoryTreeItem key={sub.id} category={sub} depth={depth + 1} />
                                ))}
                            </div>
                        )}
                    </div>
                );
            };

            // COMPOSANT CARTE PRODUIT
            const ProductCard = ({ product }) => {
                const brand = brands.find(b => b.id === product.brand_id);
                
                // Filtrer les déclinaisons si "hideOutOfStock" est activé
                const availableVariants = hideOutOfStock 
                    ? product.variants.filter(v => (v.stock ?? 1) > 0)
                    : product.variants;

                if (availableVariants.length === 0) return null;

                const selectedVarId = selectedVariantByProduct[product.id] || availableVariants[0]?.id;
                const currentVariant = availableVariants.find(v => v.id === selectedVarId) || availableVariants[0] || {};
                const displayImage = currentVariant?.image_url || product.main_image_url;
                const currentQty = quantityByProduct[product.id] || 1;

                const hasMultipleVariants = availableVariants.length > 1;
                const isOutOfStock = (currentVariant.stock ?? 1) === 0;

                return (
                    <div className="bg-slate-900/90 border border-slate-800/80 rounded-3xl overflow-hidden shadow-xl flex flex-col justify-between group hover:border-teal-500/60 transition duration-300">
                        <div>
                            <div className="relative h-44 sm:h-56 overflow-hidden bg-white flex items-center justify-center p-3 cursor-pointer" onClick={() => setSelectedProductModal(product)}>
                                <img src={displayImage} alt={product.name} className="max-w-full max-h-full object-contain group-hover:scale-105 transition duration-500" />
                                {brand && <span className="absolute top-2 left-2 bg-slate-950/90 backdrop-blur-md text-teal-400 text-[9px] sm:text-[10px] uppercase font-extrabold px-2 py-0.5 rounded-full border border-slate-800">{brand.name}</span>}
                                {isOutOfStock && <span className="absolute top-2 right-2 bg-rose-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-full">En rupture</span>}
                            </div>
                            
                            <div className="p-3 sm:p-5 space-y-2.5">
                                <h3 className="font-bold text-xs sm:text-base text-slate-100 cursor-pointer hover:text-teal-400 transition" onClick={() => setSelectedProductModal(product)}>{product.name}</h3>
                                {product.short_description && (
                                    <p className="text-[11px] sm:text-xs text-slate-400 line-clamp-2 leading-relaxed">{product.short_description}</p>
                                )}

                                {hasMultipleVariants ? (
                                    <div className="pt-2 space-y-1.5 border-t border-slate-800/60">
                                        <span className="text-[9px] font-bold text-slate-400 uppercase tracking-wider block">Déclinaisons :</span>
                                        <div className="flex flex-wrap gap-1 max-h-20 overflow-y-auto pr-1">
                                            {availableVariants.map((v, idx) => {
                                                const isSelected = v.id === currentVariant.id;
                                                const labels = [];
                                                if (v.volume_ml && v.volume_ml !== '-') labels.push(v.volume_ml);
                                                if (v.nicotine_level && v.nicotine_level !== '-') labels.push(v.nicotine_level);
                                                if (v.flavor && v.flavor !== '-') labels.push(v.flavor);
                                                if (v.ohm_value && v.ohm_value !== '-') labels.push(v.ohm_value);
                                                if (v.color_finish && v.color_finish !== '-') labels.push(v.color_finish);

                                                const labelText = labels.length > 0 ? labels.join(' • ') : `Option #${idx + 1}`;

                                                return (
                                                    <button
                                                        key={v.id}
                                                        onClick={() => setSelectedVariantByProduct({ ...selectedVariantByProduct, [product.id]: v.id })}
                                                        className={`text-[9px] sm:text-[10px] px-2 py-1 rounded-lg border font-semibold transition ${
                                                            isSelected 
                                                                ? 'bg-teal-500 text-slate-950 border-teal-400 font-black shadow-sm' 
                                                                : 'bg-slate-950 text-slate-300 border-slate-800 hover:border-slate-700'
                                                        }`}
                                                    >
                                                        {labelText}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="pt-2 flex flex-wrap gap-1 border-t border-slate-800/60">
                                        {currentVariant.volume_ml && currentVariant.volume_ml !== '-' && (
                                            <span className="text-[9px] sm:text-[10px] bg-slate-950 text-teal-300 border border-slate-800 px-2 py-0.5 rounded-md font-bold">
                                                💧 {currentVariant.volume_ml}
                                            </span>
                                        )}
                                        {currentVariant.nicotine_level && currentVariant.nicotine_level !== '-' && (

                if (existingIndex > -1) {
                    const updated = [...cart];
                    updated[existingIndex].quantity += qty;

                                            <div>
                                                <label className="text-xs text-slate-400 font-bold uppercase">Numéro WhatsApp (+261...)</label>
                                                <input type="text" value={settings.whatsappNumber} onChange={e=>setSettings({...settings, whatsappNumber: e.target.value})} className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" />
                                            </div>
                                            <div>
                                                <label className="text-xs text-slate-400 font-bold uppercase">Message pré-rempli</label>
                                                <textarea value={settings.whatsappMessage} onChange={e=>setSettings({...settings, whatsappMessage: e.target.value})} className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" rows="2"></textarea>
                                            </div>
                                            <div>
                                                <label className="text-xs text-slate-400 font-bold uppercase">Lien Messenger</label>
                                                <input type="text" value={settings.messengerUrl} onChange={e=>setSettings({...settings, messengerUrl: e.target.value})} className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" />
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* MODAL FICHE PRODUIT DÉTAILLÉE */}
                    {selectedProductModal && (() => {
                        const product = selectedProductModal;
                        const availableVariants = hideOutOfStock 
                            ? product.variants.filter(v => (v.stock ?? 1) > 0)
                            : product.variants;

                        const selectedVarId = selectedVariantByProduct[product.id] || availableVariants[0]?.id;
                        const currentVariant = availableVariants.find(v => v.id === selectedVarId) || availableVariants[0] || {};
                        const displayImage = currentVariant?.image_url || product.main_image_url;
                        const currentQty = quantityByProduct[product.id] || 1;
                        const brand = brands.find(b => b.id === product.brand_id);
                        const isOutOfStock = (currentVariant.stock ?? 1) === 0;

                        const availableVolumes = Array.from(new Set(availableVariants.map(v => v.volume_ml).filter(v => v && v !== '-')));
                        const availableNicotines = Array.from(new Set(availableVariants.map(v => v.nicotine_level).filter(v => v && v !== '-')));

                        const handleDiySelectionChange = (newVol, newNic) => {
                            const matchedVar = availableVariants.find(v => 
                                (newVol ? v.volume_ml === newVol : true) && 
                                (newNic ? v.nicotine_level === newNic : true)
                            );
                            if (matchedVar) {
                                setSelectedVariantByProduct({ ...selectedVariantByProduct, [product.id]: matchedVar.id });
                            }
                        };

                        return (
                            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                                <div className="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl max-w-xl w-full shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto">
                                    <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                        <div>
                                            {brand && <span className="text-[10px] bg-teal-500/20 text-teal-400 px-2.5 py-0.5 rounded-full font-bold uppercase">{brand.name}</span>}
                                            <h3 className="text-lg font-black text-slate-100 mt-1">{product.name}</h3>
                                        </div>
                                        <button onClick={() => setSelectedProductModal(null)} className="text-slate-400 hover:text-white font-bold text-lg">✕</button>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div className="w-full h-48 sm:h-56 bg-white rounded-2xl border border-slate-800 flex items-center justify-center p-3 relative">
                                            <img src={displayImage} alt={product.name} className="max-w-full max-h-full object-contain" />
                                            {isOutOfStock && <span className="absolute top-2 right-2 bg-rose-500 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full">En rupture</span>}
                                        </div>
                                        <div className="space-y-3">
                                            <p className="text-xs text-slate-300 leading-relaxed">{product.short_description}</p>
                                            <div className="text-teal-400 font-black text-xl">{((currentVariant.price || 0) * currentQty).toLocaleString()} Ar</div>
                                            <p className="text-xs font-bold text-slate-400">Statut : <span className={!isOutOfStock ? "text-emerald-400" : "text-rose-400"}>{!isOutOfStock ? "Disponible" : "En rupture de stock"}</span></p>
                                            
                                            <div className="space-y-1 pt-1">
                                                {currentVariant.volume_ml && currentVariant.volume_ml !== '-' && (
                                                    <div className="text-xs bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl">
                                                        <span className="text-slate-400 font-bold">Volume / Contenance : </span>
                                                        <span className="text-teal-300 font-extrabold">{currentVariant.volume_ml}</span>
                                                    </div>
                                                )}
                                                {currentVariant.nicotine_level && currentVariant.nicotine_level !== '-' && (
                                                    <div className="text-xs bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl">
                                                        <span className="text-slate-400 font-bold">Taux de Nicotine : </span>
                                                        <span className="text-indigo-300 font-extrabold">{currentVariant.nicotine_level}</span>
                                                    </div>
                                                )}
                                                {currentVariant.flavor && currentVariant.flavor !== '-' && (
                                                    <div className="text-xs bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl">
                                                        <span className="text-slate-400 font-bold">Saveur : </span>
                                                        <span className="text-amber-300 font-extrabold">{currentVariant.flavor}</span>
                                                    </div>
                                                )}
                                                {currentVariant.ohm_value && currentVariant.ohm_value !== '-' && (
                                                    <div className="text-xs bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl">
                                                        <span className="text-slate-400 font-bold">Résistance : </span>
                                                        <span className="text-emerald-300 font-extrabold">{currentVariant.ohm_value}</span>
                                                    </div>
                                                )}
                                                {currentVariant.color_finish && currentVariant.color_finish !== '-' && (
                                                    <div className="text-xs bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl">
                                                        <span className="text-slate-400 font-bold">Coloris / Finition : </span>
                                                        <span className="text-purple-300 font-extrabold">{currentVariant.color_finish}</span>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    {(availableVolumes.length > 0 || availableNicotines.length > 0) && (
                                        <div className="bg-slate-950 border border-teal-500/30 p-4 rounded-2xl space-y-3">
                                            <span className="text-xs font-black uppercase text-teal-400 tracking-wider block">Personnaliser votre E-Liquide / DIY</span>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                {availableVolumes.length > 0 && (
                                                    <div>
                                                        <label className="text-[10px] font-bold text-slate-400 uppercase">Choisir la Contenance (Volume)</label>
                                                        <select 
                                                            value={currentVariant.volume_ml || ''} 
                                                            onChange={(e) => handleDiySelectionChange(e.target.value, currentVariant.nicotine_level)}
                                                            className="w-full mt-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs font-bold text-teal-300 focus:outline-none focus:border-teal-500">
                                                            {availableVolumes.map(vol => (
                                                                <option key={vol} value={vol}>{vol}</option>
                                                            ))}
                                                        </select>
                                                    </div>
                                                )}

                                                {availableNicotines.length > 0 && (
                                                    <div>
                                                        <label className="text-[10px] font-bold text-slate-400 uppercase">Choisir le Taux de Nicotine</label>
                                                        <select 
                                                            value={currentVariant.nicotine_level || ''} 
                                                            onChange={(e) => handleDiySelectionChange(currentVariant.volume_ml, e.target.value)}
                                                            className="w-full mt-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs font-bold text-indigo-300 focus:outline-none focus:border-indigo-500">
                                                            {availableNicotines.map(nic => (
                                                                <option key={nic} value={nic}>{nic}</option>
                                                            ))}
                                                        </select>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {availableVariants.length > 1 && (
                                        <div className="space-y-1.5 pt-2 border-t border-slate-800">
                                            <span className="text-xs font-bold text-slate-400 uppercase">Changer d'option / déclinaison :</span>
                                            <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto pr-1">
                                                {availableVariants.map(v => (
                                                    <button 
                                                        key={v.id} 
                                                        onClick={() => setSelectedVariantByProduct({...selectedVariantByProduct, [product.id]: v.id})}
                                                        className={`text-xs px-3 py-2 rounded-xl border font-semibold transition flex flex-col items-start ${currentVariant.id === v.id ? 'bg-teal-500 text-slate-950 border-teal-400 shadow-lg' : 'bg-slate-950 border-slate-800 text-slate-300'}`}>
                                                        <span className="font-bold">{v.flavor !== '-' ? v.flavor : 'Option'}</span>
                                                        <span className="text-[10px] opacity-80">{v.volume_ml !== '-' ? v.volume_ml : ''} {v.nicotine_level !== '-' ? '• Nic: ' + v.nicotine_level : ''} {v.color_finish !== '-' ? '• Color: ' + v.color_finish : ''}</span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {product.box_content && (
                                        <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-1.5">
                                            <h4 className="text-xs font-black uppercase text-teal-400 tracking-wider">Contenu de la boîte</h4>
                                            <p className="text-xs text-slate-300 whitespace-pre-line leading-relaxed">{product.box_content}</p>
                                        </div>
                                    )}

                                    <div className="flex items-center justify-between pt-2 border-t border-slate-800">
                                        <div className="flex items-center space-x-3">
                                            <span className="text-xs font-bold text-slate-400 uppercase">Quantité :</span>
                                            <div className="flex items-center space-x-2">
                                                <button onClick={() => setQuantityByProduct({...quantityByProduct, [product.id]: Math.max(1, currentQty - 1)})} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-xl text-sm font-bold">-</button>
                                                <span className="text-sm font-bold text-teal-400 px-2">{currentQty}</span>
                                                <button onClick={() => setQuantityByProduct({...quantityByProduct, [product.id]: currentQty + 1})} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-xl text-sm font-bold">+</button>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => { addToCart(product, currentVariant, currentQty); setSelectedProductModal(null); }}
                                            disabled={isOutOfStock}
                                            className="px-6 py-3 bg-teal-500 hover:bg-teal-400 disabled:opacity-40 text-slate-950 rounded-2xl text-xs font-black uppercase tracking-wider transition shadow-lg shadow-teal-500/25">
                                            {isOutOfStock ? 'Épuisé' : 'Ajouter au panier'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* MODAL PANIER */}
                    {showCartModal && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl max-w-lg w-full shadow-2xl space-y-5">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="text-base font-black text-slate-100 uppercase tracking-wider flex items-center space-x-2">
                                        <span>Mon Panier</span>
                                        <span className="text-xs bg-teal-500/20 text-teal-400 px-2 py-0.5 rounded-full">{cart.reduce((sum, i) => sum + i.quantity, 0)}</span>
                                    </h3>
                                    <button onClick={() => setShowCartModal(false)} className="text-slate-400 hover:text-white font-bold text-lg">✕</button>
                                </div>

                                {cart.length === 0 ? (
                                    <div className="text-center py-8">
                                        <p className="text-xs text-slate-500">Votre panier est vide pour le moment.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-3 max-h-64 overflow-y-auto pr-1">
                                        {cart.map(item => (
                                            <div key={item.cartId} className="bg-slate-950 p-3 rounded-2xl border border-slate-800 flex justify-between items-center text-xs">
                                                <div>
                                                    <p className="font-bold text-slate-200">{item.name}</p>
                                                    <p className="text-slate-400 mt-0.5">
                                                        {item.quantity}x [Prix : {(item.selectedVariant.price * item.quantity).toLocaleString()} Ar]
                                                    </p>
                                                </div>
                                                <button onClick={() => setCart(cart.filter(c => c.cartId !== item.cartId))} className="w-6 h-6 rounded-lg bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white flex items-center justify-center font-bold transition">×</button>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <div className="border-t border-slate-800 pt-3 flex justify-between items-center font-black text-base">
                                    <span className="text-slate-400">Total :</span>
                                    <span className="text-teal-400">{cartTotal.toLocaleString()} Ar</span>
                                </div>

                                <div className="space-y-2.5 pt-2">
                                    <button 
                                        onClick={() => { checkoutWhatsApp(); setShowCartModal(false); }}
                                        disabled={cart.length === 0}
                                        className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white rounded-2xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-emerald-600/25 flex items-center justify-center space-x-2">
                                        <span>Commander via WhatsApp</span>
                                    </button>
                                    <button 
                                        onClick={() => { checkoutMessenger(); setShowCartModal(false); }}
                                        disabled={cart.length === 0}
                                        className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white rounded-2xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-blue-600/25 flex items-center justify-center space-x-2">
                                        <span>Commander via Messenger</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="border-t border-slate-800/80 bg-slate-900/40 py-6 text-center text-xs text-slate-500 mt-16 flex flex-col items-center justify-center space-y-2">
                        <p>Esigara.mg — Solutions E-commerce & Vape à Madagascar.</p>
                        <button onClick={() => setShowAuthModal(true)} className="text-[10px] text-slate-700 hover:text-slate-400 transition">
                            Connexion Administrateur Supabase
                        </button>
                    </footer>

                    {showAuthModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-5">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-base font-black text-indigo-400 uppercase tracking-wider">Connexion Administrateur</h3>
                                    <button onClick={() => setShowAuthModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                                </div>
                                <form onSubmit={handleSupabaseLogin} className="space-y-4">
                                    <div>
                                        <label className="text-[11px] font-bold text-slate-400 uppercase">Email (Login Supabase)</label>
                                        <input type="email" value={adminEmail} onChange={e=>setAdminEmail(e.target.value)} placeholder="admin@esigara.mg" className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" required />
                                    </div>
                                    <div>
                                        <label className="text-[11px] font-bold text-slate-400 uppercase">Mot de passe</label>
                                        <input type="password" value={adminPassword} onChange={e=>setAdminPassword(e.target.value)} placeholder="••••••••" className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" required />
                                    </div>
                                    <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-indigo-600/30">
                                        Se connecter
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
