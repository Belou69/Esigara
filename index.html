<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esigara.mg - E-commerce Vape Madagascar</title>
    
    <!-- Balises Anti-Cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel pour JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Client Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-teal-500 selection:text-slate-950 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Configuration Supabase
        const SUPABASE_URL = "https://fcagaagjkgwejtnvdzoj.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oiiGr4O_j3Qs-udNt8if5w_SOPD-VG4";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            // Vérification de l'âge (+18 ans)
            const [isAgeVerified, setIsAgeVerified] = useState(false);

            useEffect(() => {
                const ageConfirmed = localStorage.getItem('esigara_age_verified');
                if (ageConfirmed === 'true') {
                    setIsAgeVerified(true);
                }
            }, []);

            const confirmAge = () => {
                localStorage.setItem('esigara_age_verified', 'true');
                setIsAgeVerified(true);
            };

            const [currentView, setCurrentView] = useState('home'); 
            const [selectedCategoryId, setSelectedCategoryId] = useState(null);
            const [selectedBrandId, setSelectedBrandId] = useState(null);
            
            const [searchQuery, setSearchQuery] = useState('');
            const [showCartModal, setShowCartModal] = useState(false);
            const [selectedProductModal, setSelectedProductModal] = useState(null);
            const [isLoading, setIsLoading] = useState(true);

            // Données réelles chargées depuis Supabase
            const [brands, setBrands] = useState([]);
            const [categories, setCategories] = useState([]);
            const [products, setProducts] = useState([]);

            // Charger l'ensemble des données depuis Supabase au démarrage
            const loadDataFromSupabase = async () => {
                setIsLoading(true);
                try {
                    const { data: bData } = await supabaseClient.from('brands').select('*');
                    if (bData) setBrands(bData);

                    const { data: cData } = await supabaseClient.from('categories').select('*');
                    if (cData) setCategories(cData);

                    const { data: pData } = await supabaseClient.from('products').select('*');
                    const { data: vData } = await supabaseClient.from('variants').select('*');

                    if (pData) {
                        const fullProducts = pData.map(p => ({
                            ...p,
                            variants: (vData || []).filter(v => v.product_id === p.id)
                        }));
                        setProducts(fullProducts);
                    }
                } catch (err) {
                    console.error("Erreur de chargement Supabase :", err);
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                loadDataFromSupabase();
            }, []);

            // Support du bouton retour
            useEffect(() => {
                const handlePopState = (event) => {
                    if (event.state) {
                        setCurrentView(event.state.view || 'home');
                        setSelectedCategoryId(event.state.categoryId || null);
                        setSelectedBrandId(event.state.brandId || null);
                        setSearchQuery(event.state.searchQuery || '');
                    } else {
                        setCurrentView('home');
                        setSelectedCategoryId(null);
                        setSelectedBrandId(null);
                        setSearchQuery('');
                    }
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            const navigateTo = (view, catId = null, brandId = null, query = '') => {
                window.history.pushState({ view, categoryId: catId, brandId, searchQuery: query }, '', `#${view}`);
                setCurrentView(view);
                setSelectedCategoryId(catId);
                setSelectedBrandId(brandId);
                if (query !== '') setSearchQuery(query);
            };

            const handleSearchSubmit = (e) => {
                e.preventDefault();
                if (searchQuery.trim()) {
                    navigateTo('search', null, null, searchQuery);
                }
            };
            
            const [adminUnlocked, setAdminUnlocked] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [adminEmail, setAdminEmail] = useState('');
            const [adminPassword, setAdminPassword] = useState('');
            const [authError, setAuthError] = useState('');

            const [adminTab, setAdminTab] = useState('products');

            const [settings, setSettings] = useState({
                whatsappNumber: '+261340000000',
                whatsappMessage: 'Bonjour Esigara.mg, je souhaite finaliser ma commande :',
                messengerUrl: 'https://m.me/esigaramg'
            });

            // Formulaires d'administration Produit
            const [editingProductId, setEditingProductId] = useState(null);
            const [newProduct, setNewProduct] = useState({
                name: '', brand_id: '', category_id: '', short_description: '', box_content: '', main_image_url: 'https://images.unsplash.com/photo-1539185441755-769473a23570?auto=format&fit=crop&w=600&q=80'
            });
            
            // Déclinaisons : seul le PRIX est obligatoire
            const [variantsList, setVariantsList] = useState([
                { id: 'var_1', price: '', stock: '0', nicotine_level: '-', volume_ml: '-', ohm_value: '-', color_finish: '-', flavor: '-', image_url: '' }
            ]);

            const [isDiyCalculatorActive, setIsDiyCalculatorActive] = useState(false);
            const [diyBasePrice10ml, setDiyBasePrice10ml] = useState(15000);
            const [diyVolumeMl, setDiyVolumeMl] = useState(10);
            const [diyNicotineRate, setDiyNicotineRate] = useState('0mg');

            useEffect(() => {
                if (isDiyCalculatorActive) {
                    let multiplier = diyVolumeMl / 10;
                    let nicBonus = 0;
                    if (diyNicotineRate === '3mg') nicBonus = 2000 * (diyVolumeMl / 10);
                    if (diyNicotineRate === '6mg') nicBonus = 4000 * (diyVolumeMl / 10);
                    if (diyNicotineRate === '12mg') nicBonus = 6000 * (diyVolumeMl / 10);
                    if (diyNicotineRate === '18mg') nicBonus = 8000 * (diyVolumeMl / 10);
                    if (diyNicotineRate === '20mg') nicBonus = 10000 * (diyVolumeMl / 10);

                    const calculatedPrice = Math.round((diyBasePrice10ml * multiplier) + nicBonus);
                    
                    if (variantsList.length > 0) {
                        const updated = [...variantsList];
                        updated[0].price = calculatedPrice.toString();
                        updated[0].volume_ml = diyVolumeMl + 'ml';
                        updated[0].nicotine_level = diyNicotineRate;
                        setVariantsList(updated);
                    }
                }
            }, [isDiyCalculatorActive, diyBasePrice10ml, diyVolumeMl, diyNicotineRate]);

            const [newBrandName, setNewBrandName] = useState('');
            const [newBrandDesc, setNewBrandDesc] = useState('');
            const [newBrandLogo, setNewBrandLogo] = useState('https://images.unsplash.com/photo-1539185441755-769473a23570?auto=format&fit=crop&w=200&q=80');
            
            // Gestion avancée des Rubriques et Sous-rubriques
            const [editingCatId, setEditingCatId] = useState(null);
            const [newCatName, setNewCatName] = useState('');
            const [newCatParent, setNewCatParent] = useState('');
            const [newCatImage, setNewCatImage] = useState('https://images.unsplash.com/photo-1527661591475-527312dd65f5?auto=format&fit=crop&w=600&q=80');

            const [cart, setCart] = useState([]);
            const [selectedVariantByProduct, setSelectedVariantByProduct] = useState({});
            const [quantityByProduct, setQuantityByProduct] = useState({});

            const handleSupabaseLogin = async (e) => {
                e.preventDefault();
                setAuthError('');
                try {
                    const { error } = await supabaseClient.auth.signInWithPassword({
                        email: adminEmail,
                        password: adminPassword,
                    });
                    if (error) throw error;
                    setAdminUnlocked(true);
                    setShowAuthModal(false);
                    navigateTo('admin');
                } catch (err) {
                    setAuthError(err.message || 'Identifiants invalides.');
                }
            };

            const handleLocalImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setNewProduct({ ...newProduct, main_image_url: reader.result });
                    reader.readAsDataURL(file);
                }
            };

            const handleVariantImageUpload = (varId, e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setVariantsList(variantsList.map(v => v.id === varId ? { ...v, image_url: reader.result } : v));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleBrandLogoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setNewBrandLogo(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleLocalCatImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setNewCatImage(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const addVariantField = () => {
                setVariantsList([...variantsList, { id: 'var_' + Date.now(), price: '', stock: '0', nicotine_level: '-', volume_ml: '-', ohm_value: '-', color_finish: '-', flavor: '-', image_url: '' }]);
            };

            const removeVariantField = (id) => {
                if (variantsList.length === 1) return alert('Le produit doit avoir au moins un tarif/prix principal.');
                setVariantsList(variantsList.filter(v => v.id !== id));
            };

            const handleVariantChange = (id, field, value) => {
                setVariantsList(variantsList.map(v => v.id === id ? { ...v, [field]: value } : v));
            };

            const handleSaveProduct = async (e) => {
                e.preventDefault();
                if (!newProduct.name) return alert('Veuillez spécifier le nom du produit.');
                if (variantsList.some(v => !v.price || isNaN(parseFloat(v.price)))) {
                    return alert('Chaque déclinaison doit posséder au moins un prix valide.');
                }

                const productId = editingProductId || Date.now().toString();

                const { error: pError } = await supabaseClient.from('products').upsert([{
                    id: productId,
                    name: newProduct.name,
                    brand_id: newProduct.brand_id || null,
                    category_id: newProduct.category_id || null,
                    short_description: newProduct.short_description || '',
                    box_content: newProduct.box_content || '',
                    main_image_url: newProduct.main_image_url
                }]);

                if (pError) return alert('Erreur enregistrement produit : ' + pError.message);

                if (editingProductId) {
                    await supabaseClient.from('variants').delete().eq('product_id', productId);
                }

                const formattedVariants = variantsList.map((v, i) => ({
                    id: 'var_' + productId + '_' + i,
                    product_id: productId,
                    price: parseFloat(v.price),
                    stock: v.stock !== '' ? parseInt(v.stock) : 0,
                    nicotine_level: v.nicotine_level || '-',
                    volume_ml: v.volume_ml || '-',
                    ohm_value: v.ohm_value || '-',
                    color_finish: v.color_finish || '-',
                    flavor: v.flavor || '-',
                    image_url: v.image_url || ''
                }));

                const { error: vError } = await supabaseClient.from('variants').insert(formattedVariants);

                if (vError) return alert('Erreur enregistrement variantes : ' + vError.message);

                alert(editingProductId ? 'Produit mis à jour avec succès !' : 'Produit enregistré avec succès !');
                setEditingProductId(null);
                setNewProduct({ name: '', brand_id: '', category_id: '', short_description: '', box_content: '', main_image_url: 'https://images.unsplash.com/photo-1539185441755-769473a23570?auto=format&fit=crop&w=600&q=80' });
                setVariantsList([{ id: 'var_1', price: '', stock: '0', nicotine_level: '-', volume_ml: '-', ohm_value: '-', color_finish: '-', flavor: '-', image_url: '' }]);
                setIsDiyCalculatorActive(false);
                loadDataFromSupabase();
            };

            const startEditProduct = (prod) => {
                setEditingProductId(prod.id);
                setNewProduct({
                    name: prod.name,
                    brand_id: prod.brand_id || '',
                    category_id: prod.category_id || '',
                    short_description: prod.short_description || '',
                    box_content: prod.box_content || '',
                    main_image_url: prod.main_image_url
                });
                setVariantsList(prod.variants.map(v => ({
                    id: v.id,
                    price: v.price.toString(),
                    stock: (v.stock ?? 0).toString(),
                    nicotine_level: v.nicotine_level || '-',
                    volume_ml: v.volume_ml || '-',
                    ohm_value: v.ohm_value || '-',
                    color_finish: v.color_finish || '-',
                    flavor: v.flavor || '-',
                    image_url: v.image_url || ''
                })));
            };

            const deleteProduct = async (id) => {
                if (confirm('Voulez-vous vraiment supprimer ce produit ?')) {
                    await supabaseClient.from('products').delete().eq('id', id);
                    loadDataFromSupabase();
                }
            };

            const handleAddBrand = async (e) => {
                e.preventDefault();
                if (!newBrandName) return;
                const brandObj = {
                    id: 'b_' + Date.now(),
                    name: newBrandName,
                    slug: newBrandName.toLowerCase().replace(/\s+/g, '-'),
                    description: newBrandDesc,
                    logo_url: newBrandLogo
                };
                const { error } = await supabaseClient.from('brands').insert([brandObj]);
                if (error) return alert('Erreur : ' + error.message);
                
                setNewBrandName(''); 
                setNewBrandDesc('');
                setNewBrandLogo('https://images.unsplash.com/photo-1539185441755-769473a23570?auto=format&fit=crop&w=200&q=80');
                alert('Marque ajoutée avec succès !');
                loadDataFromSupabase();
            };

            const deleteBrand = async (id) => {
                if (confirm('Voulez-vous vraiment supprimer cette marque ?')) {
                    await supabaseClient.from('brands').delete().eq('id', id);
                    loadDataFromSupabase();
                }
            };

            // Création & Modification des Rubriques et Sous-Rubriques
            const handleSaveCategory = async (e) => {
                e.preventDefault();
                if (!newCatName) return;

                const catObj = {
                    id: editingCatId || ('c_' + Date.now()),
                    parent_id: newCatParent === '' ? null : newCatParent,
                    name: newCatName,
                    slug: newCatName.toLowerCase().replace(/\s+/g, '-'),
                    image: newCatImage
                };

                const { error } = await supabaseClient.from('categories').upsert([catObj]);
                if (error) return alert('Erreur : ' + error.message);

                setEditingCatId(null);
                setNewCatName('');
                setNewCatParent('');
                setNewCatImage('https://images.unsplash.com/photo-1527661591475-527312dd65f5?auto=format&fit=crop&w=600&q=80');
                alert(newCatParent ? 'Sous-rubrique enregistrée !' : 'Rubrique principale enregistrée !');
                loadDataFromSupabase();
            };

            const startAddSubCategory = (parentCat) => {
                setEditingCatId(null);
                setNewCatName('');
                setNewCatParent(parentCat.id);
                setNewCatImage('https://images.unsplash.com/photo-1527661591475-527312dd65f5?auto=format&fit=crop&w=600&q=80');
            };

            const startEditCategory = (cat) => {
                setEditingCatId(cat.id);
                setNewCatName(cat.name);
                setNewCatParent(cat.parent_id || '');
                setNewCatImage(cat.image);
            };

            const deleteCategory = async (id) => {
                if (confirm('Voulez-vous supprimer cette rubrique ? Les sous-rubriques éventuellement rattachées seront également impactées.')) {
                    await supabaseClient.from('categories').delete().eq('id', id);
                    loadDataFromSupabase();
                }
            };

            const addToCart = (product, variant, qtyOverride = null) => {
                const qty = qtyOverride !== null ? qtyOverride : (parseInt(quantityByProduct[product.id]) || 1);
                
                if (variant.stock < qty) {
                    return alert(`Stock insuffisant ! Il ne reste que ${variant.stock} exemplaire(s).`);
                }

                const existingIndex = cart.findIndex(item => item.id === product.id && item.selectedVariant.id === variant.id);
                
                if (existingIndex > -1) {
                    const updated = [...cart];
                    if (variant.stock < updated[existingIndex].quantity + qty) {
                        return alert(`Stock insuffisant pour ajouter ${qty} de plus.`);
                    }
                    updated[existingIndex].quantity += qty;
                    setCart(updated);
                } else {
                    setCart([...cart, { ...product, selectedVariant: variant, quantity: qty, cartId: Date.now() }]);
                }
                setShowCartModal(true);
            };

            const processOrderStockReduction = async () => {
                for (const item of cart) {
                    const newStock = Math.max(0, item.selectedVariant.stock - item.quantity);
                    await supabaseClient.from('variants').update({ stock: newStock }).eq('id', item.selectedVariant.id);
                }
                loadDataFromSupabase();
            };

            const cartTotal = cart.reduce((sum, item) => sum + (item.selectedVariant.price * item.quantity), 0);

            const checkoutWhatsApp = async () => {
                await processOrderStockReduction();
                let text = `${settings.whatsappMessage}%0A`;
                cart.forEach((item) => {
                    text += `- ${item.name} (${item.quantity}x) [Saveur: ${item.selectedVariant.flavor} | ${item.selectedVariant.volume_ml} | Nic: ${item.selectedVariant.nicotine_level}] - ${(item.selectedVariant.price * item.quantity).toLocaleString()} Ar%0A`;
                });
                text += `%0ATotal : *${cartTotal.toLocaleString()} Ar*`;
                window.open(`https://wa.me/${settings.whatsappNumber.replace(/[^0-9]/g, '')}?text=${text}`, '_blank');
                setCart([]);
            };

            const checkoutMessenger = async () => {
                await processOrderStockReduction();
                window.open(settings.messengerUrl, '_blank');
                setCart([]);
            };

            const activeCategory = categories.find(c => c.id === selectedCategoryId);
            const activeBrand = brands.find(b => b.id === selectedBrandId);

            const searchResults = products.filter(p => {
                if (!searchQuery.trim()) return false;
                const queryWords = searchQuery.toLowerCase().trim().split(/\s+/);
                const brand = brands.find(b => b.id === p.brand_id);
                const category = categories.find(c => c.id === p.category_id);
                
                const searchableText = [
                    p.name,
                    p.short_description,
                    p.box_content,
                    brand ? brand.name : '',
                    category ? category.name : '',
                    ...p.variants.map(v => `${v.flavor} ${v.nicotine_level} ${v.volume_ml} ${v.color_finish}`)
                ].join(' ').toLowerCase();

                return queryWords.every(word => searchableText.includes(word));
            });

            return (
                <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
                    {!isAgeVerified && (
                        <div className="fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl text-center space-y-6">
                                <div className="w-16 h-16 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center mx-auto text-rose-500 font-black text-2xl">
                                    18+
                                </div>
                                <div className="space-y-2">
                                    <h2 className="text-xl font-black text-slate-100">Avertissement Légal</h2>
                                    <p className="text-xs text-slate-400 leading-relaxed">
                                        Les produits contenus sur <strong className="text-teal-400">Esigara.mg</strong> sont strictement réservés aux personnes majeures.
                                    </p>
                                    <p className="text-xs text-slate-300 font-semibold pt-2">
                                        Certifiez-vous avoir 18 ans ou plus ?
                                    </p>
                                </div>
                                <div className="space-y-2.5">
                                    <button 
                                        onClick={confirmAge}
                                        className="w-full py-3.5 bg-teal-500 hover:bg-teal-400 text-slate-950 font-black text-xs uppercase tracking-wider rounded-2xl shadow-lg shadow-teal-500/25 transition">
                                        J'ai 18 ans ou plus (Entrer)
                                    </button>
                                    <button 
                                        onClick={() => window.location.href = "https://www.google.com"}
                                        className="w-full py-3 bg-slate-950 hover:bg-slate-800 text-slate-400 font-bold text-xs rounded-2xl transition border border-slate-800">
                                        Quitter le site
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="border-b border-slate-800/80 bg-slate-900/60 sticky top-0 z-45 backdrop-blur-md">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex items-center space-x-3 cursor-pointer w-full sm:w-auto justify-between sm:justify-start" onClick={() => navigateTo('home')}>
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-teal-500/20">
                                        <svg className="w-6 h-6 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                                    </div>
                                    <div>
                                        <div className="flex items-center space-x-1.5">
                                            <span className="text-xl font-extrabold tracking-tight bg-gradient-to-r from-teal-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">ESIGARA.MG</span>
                                            <span className="text-[9px] font-black bg-rose-500/20 text-rose-400 border border-rose-500/30 px-1.5 py-0.5 rounded-full">18+</span>
                                        </div>
                                        <p className="text-[10px] text-slate-400 font-medium tracking-wider uppercase">Madagascar Vape Shop</p>
                                    </div>
                                </div>
                            </div>
                            
                            <form onSubmit={handleSearchSubmit} className="relative w-full sm:max-w-md">
                                <input 
                                    type="text" 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="Rechercher un produit, une saveur, une marque..." 
                                    className="w-full bg-slate-950/90 border border-slate-800 rounded-2xl pl-10 pr-24 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-teal-500 transition shadow-inner"
                                />
                                <svg className="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                                <button type="submit" className="absolute right-1.5 top-1.5 bg-teal-500 hover:bg-teal-400 text-slate-950 px-3 py-1.5 rounded-xl text-[11px] font-bold transition">
                                    Rechercher
                                </button>
                            </form>

                            <div className="flex items-center space-x-3 w-full sm:w-auto justify-end">
                                {currentView !== 'home' && (

                                        <button 
                                            onClick={() => { addToCart(product, currentVariant, currentQty); setSelectedProductModal(null); }}
                                            className="px-6 py-3 bg-teal-500 hover:bg-teal-400 text-slate-950 rounded-2xl text-xs font-black uppercase tracking-wider transition shadow-lg shadow-teal-500/25">
                                            Ajouter au panier
                                        </button>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {showCartModal && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl max-w-lg w-full shadow-2xl space-y-5">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="text-base font-black text-slate-100 uppercase tracking-wider flex items-center space-x-2">
                                        <span>Mon Panier</span>
                                        <span className="text-xs bg-teal-500/20 text-teal-400 px-2 py-0.5 rounded-full">{cart.reduce((sum, i) => sum + i.quantity, 0)}</span>
                                    </h3>
                                    <button onClick={() => setShowCartModal(false)} className="text-slate-400 hover:text-white font-bold text-lg">✕</button>
                                </div>

                                {cart.length === 0 ? (
                                    <div className="text-center py-8">
                                        <p className="text-xs text-slate-500">Votre panier est vide pour le moment.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-3 max-h-64 overflow-y-auto pr-1">
                                        {cart.map(item => (
                                            <div key={item.cartId} className="bg-slate-950 p-3 rounded-2xl border border-slate-800 flex justify-between items-center text-xs">
                                                <div>
                                                    <p className="font-bold text-slate-200">{item.name}</p>
                                                    <p className="text-slate-400 mt-0.5">
                                                        {item.quantity}x [Prix : {(item.selectedVariant.price * item.quantity).toLocaleString()} Ar]
                                                    </p>
                                                </div>
                                                <button onClick={() => setCart(cart.filter(c => c.cartId !== item.cartId))} className="w-6 h-6 rounded-lg bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white flex items-center justify-center font-bold transition">×</button>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <div className="border-t border-slate-800 pt-3 flex justify-between items-center font-black text-base">
                                    <span className="text-slate-400">Total :</span>
                                    <span className="text-teal-400">{cartTotal.toLocaleString()} Ar</span>
                                </div>

                                <div className="space-y-2.5 pt-2">
                                    <button 
                                        onClick={() => { checkoutWhatsApp(); setShowCartModal(false); }}
                                        disabled={cart.length === 0}
                                        className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white rounded-2xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-emerald-600/25 flex items-center justify-center space-x-2">
                                        <span>Commander via WhatsApp</span>
                                    </button>
                                    <button 
                                        onClick={() => { checkoutMessenger(); setShowCartModal(false); }}
                                        disabled={cart.length === 0}
                                        className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white rounded-2xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-blue-600/25 flex items-center justify-center space-x-2">
                                        <span>Commander via Messenger</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="border-t border-slate-800/80 bg-slate-900/40 py-6 text-center text-xs text-slate-500 mt-16 flex flex-col items-center justify-center space-y-2">
                        <p>Esigara.mg — Solutions E-commerce & Vape à Madagascar.</p>
                        <button onClick={() => setShowAuthModal(true)} className="text-[10px] text-slate-700 hover:text-slate-400 transition">
                            Connexion Administrateur Supabase
                        </button>
                    </footer>

                    {showAuthModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-5">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-base font-black text-indigo-400 uppercase tracking-wider">Connexion Administrateur</h3>
                                    <button onClick={() => setShowAuthModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                                </div>
                                <form onSubmit={handleSupabaseLogin} className="space-y-4">
                                    <div>
                                        <label className="text-[11px] font-bold text-slate-400 uppercase">Email (Login Supabase)</label>
                                        <input type="email" value={adminEmail} onChange={e=>setAdminEmail(e.target.value)} placeholder="admin@esigara.mg" className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" required />
                                    </div>
                                    <div>
                                        <label className="text-[11px] font-bold text-slate-400 uppercase">Mot de passe</label>
                                        <input type="password" value={adminPassword} onChange={e=>setAdminPassword(e.target.value)} placeholder="••••••••" className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" required />
                                    </div>
                                    <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-indigo-600/30">
                                        Se connecter
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
