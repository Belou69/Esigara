                                                                + Ligne de prix
                                                            </button>
                                                        </div>
                                                        <div className="space-y-2 max-h-40 overflow-y-auto pr-1">
                                                            {newCatPriceTable.map((row, index) => (
                                                                <div key={index} className="flex gap-2 items-center">
                                                                    <input
                                                                        type="text"
                                                                        value={row.label}
                                                                        onChange={e => setNewCatPriceTable(newCatPriceTable.map((r, i) => i === index ? { ...r, label: e.target.value } : r))}
                                                                        placeholder="Désignation (ex: 10ml, Pack 3...)"
                                                                        className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs"
                                                                    />
                                                                    <input
                                                                        type="text"
                                                                        value={row.price}
                                                                        onChange={e => setNewCatPriceTable(newCatPriceTable.map((r, i) => i === index ? { ...r, price: e.target.value } : r))}
                                                                        placeholder="Prix (Ar)"
                                                                        className="w-24 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-teal-400 font-bold"
                                                                    />
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => setNewCatPriceTable(newCatPriceTable.filter((_, i) => i !== index))}
                                                                        className="text-rose-400 text-xs font-bold px-1">✕</button>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>

                                                    <div className="flex gap-2 pt-2">
                                                        <button type="submit" className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-xs uppercase">
                                                            {editingCatId ? 'Mettre à jour' : 'Enregistrer le dossier'}
                                                        </button>
                                                        {(editingCatId || newCatParent) && (
                                                            <button type="button" onClick={resetCategoryForm} className="px-4 py-2.5 bg-slate-800 rounded-xl text-xs font-bold">Annuler</button>
                                                        )}
                                                    </div>
                                                </form>

                                                <div className="pt-4 border-t border-slate-800 space-y-2">
                                                    <span className="text-xs font-bold text-slate-400 uppercase">Arborescence & Disposition (▲ ▼ pour trier)</span>
                                                    <div className="space-y-3 max-h-[350px] overflow-y-auto pr-1">
                                                        {categories.filter(c => !c.parent_id).map(mainCat => (
                                                            <CategoryTreeItem
                                                                key={mainCat.id}
                                                                category={mainCat}
                                                                categories={categories}
                                                                onAddChild={startAddSubCategory}
                                                                onEdit={startEditCategory}
                                                                onDelete={deleteCategory}
                                                                onMove={moveCategoryOrder}
                                                            />
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {adminTab === 'settings' && (
                                    <div className="max-w-2xl mx-auto space-y-6">
                                        <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl space-y-6">
                                            <h3 className="text-sm font-bold uppercase text-indigo-400">Modèle de prix DIY par Volume & Nicotine (0mg, 3mg, 6mg)</h3>
                                            <p className="text-xs text-slate-400">Configurez ci-dessous le prix exact pour chaque combinaison de volume et de taux de nicotine. En cochant la case dans le générateur rapide de produit, ces tarifs s'appliqueront automatiquement.</p>
                                            
                                            <div className="space-y-4 max-h-[500px] overflow-y-auto pr-1">
                                                {['10ml', '30ml', '50ml', '100ml', '200ml', '500ml'].map(vol => (
                                                    <div key={vol} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2">
                                                        <h4 className="text-xs font-black text-teal-400 uppercase">Contenance : {vol}</h4>
                                                        <div className="grid grid-cols-3 gap-2">
                                                            {['0mg', '3mg', '6mg'].map(nic => (
                                                                <div key={nic}>
                                                                    <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">{nic}</label>
                                                                    <input 
                                                                        type="number" 
                                                                        value={diyPresetPrices[`${vol}_${nic}`] || ''} 
                                                                        onChange={e => setDiyPresetPrices({...diyPresetPrices, [`${vol}_${nic}`]: e.target.value})} 
                                                                        placeholder="Prix (Ar)" 
                                                                        className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-teal-400 font-bold" 
                                                                    />
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>

                                            <button onClick={handleSaveDiyPreset} className="w-full py-3 bg-teal-500 hover:bg-teal-400 text-black rounded-xl font-black text-xs uppercase tracking-wider transition shadow">
                                                Enregistrer ce modèle de prix complet
                                            </button>
                                        </div>

                                        <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl space-y-6">
                                            <h3 className="text-sm font-bold uppercase text-indigo-400">Paramètres Généraux & Commandes</h3>

                                            <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex items-center justify-between gap-3">
                                                <div>
                                                    <h4 className="text-xs font-bold text-slate-200">Masquer les produits en rupture</h4>
                                                    <p className="text-[10px] text-slate-400">Cache automatiquement les déclinaisons ou produits épuisés.</p>
                                                </div>
                                                <input
                                                    type="checkbox"
                                                    checked={settings.hideOutOfStock}
                                                    onChange={e => setSettings({ ...settings, hideOutOfStock: e.target.checked })}
                                                    className="w-5 h-5 accent-teal-500 cursor-pointer shrink-0"
                                                />
                                            </div>

                                            <div className="space-y-4 pt-2">
                                                <div>
                                                    <label className="text-xs text-slate-400 font-bold uppercase">Numéro WhatsApp (+261...)</label>
                                                    <input type="text" value={settings.whatsappNumber} onChange={e => setSettings({ ...settings, whatsappNumber: e.target.value })} className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" />
                                                </div>
                                                <div>
                                                    <label className="text-xs text-slate-400 font-bold uppercase">Message pré-rempli</label>
                                                    <textarea value={settings.whatsappMessage} onChange={e => setSettings({ ...settings, whatsappMessage: e.target.value })} className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" rows="2"></textarea>
                                                </div>
                                                <div>
                                                    <label className="text-xs text-slate-400 font-bold uppercase">Lien Messenger</label>
                                                    <input type="text" value={settings.messengerUrl} onChange={e => setSettings({ ...settings, messengerUrl: e.target.value })} className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" />
                                                </div>
                                            </div>

                                            <button onClick={handleSaveSettings} className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-black text-xs uppercase tracking-wider transition shadow-lg shadow-indigo-600/30">
                                                Enregistrer les paramètres
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {selectedProduct && (
                        <ProductModal
                            product={selectedProduct}
                            brand={brands.find(b => b.id === selectedProduct.brand_id)}
                            hideOutOfStock={hideOutOfStock}
                            selectedVarId={selectedVariantByProduct[selectedProduct.id]}
                            onSelectVariant={onSelectVariant}
                            qty={quantityByProduct[selectedProduct.id] || 1}
                            onQty={onQty}
                            onClose={closeProduct}
                            onAdd={addToCart}
                            onCopyLink={copyProductLink}
                        />
                    )}

                    {showCartModal && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4" onClick={() => setShowCartModal(false)}>
                            <div className="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl max-w-lg w-full shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="text-base font-black text-slate-100 uppercase tracking-wider flex items-center space-x-2">
                                        <span>Mon Panier</span>
                                        <span className="text-xs bg-teal-500/20 text-teal-400 px-2 py-0.5 rounded-full">{cartCount}</span>
                                    </h3>
                                    <button onClick={() => setShowCartModal(false)} className="text-slate-400 hover:text-slate-100 font-bold text-lg">✕</button>
                                </div>

                                {cartLines.length === 0 ? (
                                    <div className="text-center py-8">
                                        <p className="text-xs text-slate-500">Votre panier est vide pour le moment.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-3 max-h-64 overflow-y-auto pr-1">
                                        {cartLines.map(l => {
                                            const flavor = getFlavor(l.product, l.variant);
                                            const details = [];
                                            if (flavor) details.push(`Saveur: ${flavor}`);
                                            variantParts(l.variant).forEach(p => details.push(p));
                                            return (
                                                <div key={l.variantId} className="bg-slate-950 p-3 rounded-2xl border border-slate-800 flex justify-between items-center gap-3 text-xs">
                                                    <div className="min-w-0">
                                                        <p className="font-bold text-slate-200">{l.product.name}</p>
                                                        {details.length > 0 && <p className="text-slate-400 mt-0.5">{details.join(' | ')}</p>}
                                                        <p className="text-teal-400 font-black mt-1">{fmt(l.variant.price * l.quantity)} Ar</p>
                                                    </div>
                                                    <div className="flex items-center space-x-1.5 shrink-0">
                                                        <button onClick={() => changeCartQty(l.variantId, -1)} className="w-6 h-6 bg-slate-900 border border-slate-800 rounded-lg font-bold">-</button>
                                                        <span className="font-bold text-teal-400 w-5 text-center">{l.quantity}</span>
                                                        <button onClick={() => changeCartQty(l.variantId, 1)} className="w-6 h-6 bg-slate-900 border border-slate-800 rounded-lg font-bold">+</button>
                                                        <button onClick={() => removeFromCart(l.variantId)} className="w-6 h-6 rounded-lg bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white flex items-center justify-center font-bold transition ml-1">×</button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                                <div className="border-t border-slate-800 pt-3 flex justify-between items-center font-black text-base">
                                    <span className="text-slate-400">Total :</span>
                                    <span className="text-teal-400">{fmt(cartTotal)} Ar</span>
                                </div>

                                {cartNotice && (
                                    <div className="bg-teal-500/10 border border-teal-500/30 text-teal-200 rounded-2xl p-3 text-xs space-y-2">
                                        <p>{cartNotice.message}</p>
                                        {cartNotice.text && (
                                            <textarea readOnly value={cartNotice.text} rows="5" onFocus={(e) => e.target.select()} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-[11px] text-slate-200"></textarea>
                                        )}
                                    </div>
                                )}

                                <div className="space-y-2.5 pt-2">
                                    <button
                                        onClick={checkoutWhatsApp}
                                        disabled={cartLines.length === 0}
                                        className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white rounded-2xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-emerald-600/25 flex items-center justify-center space-x-2">
                                        <span>Commander via WhatsApp</span>
                                    </button>
                                    <button
                                        onClick={checkoutMessenger}
                                        disabled={cartLines.length === 0}
                                        className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white rounded-2xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-blue-600/25 flex items-center justify-center space-x-2">
                                        <span>Commander via Messenger</span>
                                    </button>
                                    {cartLines.length > 0 && (
                                        <button onClick={clearCart} className="w-full py-2 text-[11px] text-slate-500 hover:text-rose-400 font-bold transition">
                                            Vider le panier
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="border-t border-slate-800/80 bg-slate-900/40 py-6 text-center text-xs text-slate-500 mt-16 flex flex-col items-center justify-center space-y-2">
                        <p>Esigara.mg — Solutions E-commerce & Vape à Madagascar.</p>
                        <button onClick={() => adminUnlocked ? navigateTo('admin') : setShowAuthModal(true)} className="text-[10px] text-slate-700 hover:text-slate-400 transition">
                            Espace d'Administration
                        </button>
                    </footer>

                    {showAuthModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-5">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-base font-black text-indigo-400 uppercase tracking-wider">Connexion Administrateur</h3>
                                    <button onClick={() => setShowAuthModal(false)} className="text-slate-400 hover:text-slate-100 font-bold">✕</button>
                                </div>
                                <form onSubmit={handleSupabaseLogin} className="space-y-4">
                                    <div>
                                        <label className="text-[11px] font-bold text-slate-400 uppercase">Identifiant / Email</label>
                                        <input type="email" value={adminEmail} onChange={e => setAdminEmail(e.target.value)} placeholder="admin@esigara.mg" className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" required />
                                    </div>
                                    <div>
                                        <label className="text-[11px] font-bold text-slate-400 uppercase">Mot de passe</label>
                                        <input type="password" value={adminPassword} onChange={e => setAdminPassword(e.target.value)} placeholder="••••••••" className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" required />
                                    </div>
                                    {authError && <p className="text-xs text-rose-400">{authError}</p>}
                                    <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-indigo-600/30">
                                        Se connecter
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
